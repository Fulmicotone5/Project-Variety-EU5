l_english:
 economic_tradition_law: "Economic Tradition"
 economic_tradition_law_desc: "The Economic Policy of the Country."
 A_noeco_policy: "No Economic Tradition"
 A_noeco_policy_desc: "No economic tradition."
 PV_agrarian_society_policy: "Agrarian Society"
 PV_agrarian_society_policy_desc: "This culture is distinctly agrarian, their lands producing ample crops for hungry armies."
 PV_miners_policy: "Mining Tradition"
 PV_miners_policy_desc: "This Country has always been surrounded by raw materials, ore, and uncut gems. They have an affinity for finding sites for mining excavations."
 PV_metallurgy_policy: "Metalworkers"
 PV_metallurgy_policy_desc: "This Country has decided to specialize on metallurgy. Over time they have developed their understanding of metal to such a degree that their name has become a byword for durable and high quality arms and armor."
 PV_artisans_policy: "Expert Artisans"
 PV_artisans_policy_desc: "Children in this culture often carry on the profession of their parents, accumulating extensive knowledge and skill for their trade across generations."
 PV_clothmaker_policy: "Clothmakers"
 PV_clothmaker_policy_desc: "The people of our coutry take great pride in the exceptional quality of the textiles and the exquisite garments they manufacture."
 PV_monastic_policy: "Monastic Heritage"
 PV_monastic_policy_desc: "Decades of experience in brewing and manuscript handwriting have established the people of our country among the best in the world in these fields of craftsmanship."

 feuds_laws: "Feud Laws"
 feuds_laws_desc: "A feud, vendetta, or faida, is a long-running argument or fight, often between social groups of people, especially families or clans. In the Middle Ages it was a common societal phenomenon, and oftentimes murder had no legal consequences during a Feud."
 Fno_regulation: "No Regulation"
 Fno_regulation_desc: "Feuds between families are not regulated."
 formal_ban: "Formal Ban"
 formal_ban_desc: "The practice of the Feud is formally banned by the State. Although the practice of the Feud is officially prohibited, noble and affluent families continue to engage in it clandestinely, causing attritions in our society."
 codified_feuds: "Codified Feud Practices"
 codified_feuds_desc: "Feuds are regarded as legitimate legal mechanisms and are subject to certain regulatory frameworks. By codifying these practices, the state can formally acknowledge them as a lawful societal phenomenon, thereby mitigating numerous legal complications for our citizens."
 outlawed_feuds: "Outlawed Feuds"
 outlawed_feuds_desc: "The practice of feuding has been completely prohibited, with the State actively enforcing measures to ensure compliance. Families that fail to adhere to this regulation are subject to severe legal consequences."

 nobilityPV_laws: "Nobility"
 nobilityPV_laws_desc: "The acquisition of nobility involves gaining titles, land, and social status through inheritance, royal favor, or wealth, elevating one's societal rank."
 nobility_by_blood: "Nobility By Blood"
 nobility_by_blood_desc: "The state officially recognizes jus sanguinis as the sole criterion for attaining nobility."
 PVstatus_quo: "Status Quo"
 PVstatus_quo_desc: "The State will keep the status quo."
 nobility_by_wealth: "Nobility By Wealth"
 nobility_by_wealth_desc: "Wealthy burghers are permitted to acquire noble status, for the right price."

 PVmigration_subsidies: "Migration Subsidies"
 PVmigration_subsidies_desc: "By giving subsidies, we can encourage migration within our country."
 no_subsid: "No Subsidies"
 no_subsid_desc: "What are you looking at, bozo?"
 urbaniz_subs: "Urbanization Subsidies"
 urbaniz_subs_desc: "The State will encourage its population to migrate towards urban centers."
 rural_subs: "Rural Migration"
 rural_subs_desc: "The State will encourage its population to move migrate rural locations."

 PVprisoners_policy: "Prisoner Management"
 PVprisoners_policy_desc: "With war and criminality, the prisons of the country have a constant influx of prisoners. We must decide how to manage them."
 forced_enlistement: "Forced Enlistment"
 forced_enlistement_desc: "Prisoners are forced to serve in the army."
 forced_impressment: "Forced Impressment"
 forced_impressment_desc: "Prisoners are forced to serve in the navy."
 forced_labour: "Forced Labour"
 forced_labour_desc: "Prisoners are forced to work on fields."
 encouraged_enslavement: "Enslavement"
 encouraged_enslavement_desc: "Prisoners are enslaved."
 sistematic_ransoming: "Systematic Ransoming"
 sistematic_ransoming_desc: "Consistent with medieval customs, prisoners are released upon payment of a ransom."
 prisoner_colonies: "Prison Colonies"
 prisoner_colonies_desc: "Prisoners are forced to marry a prostitute and are subsequently sent to the colonies in exchange for their freedom."

 PVtown_administration: "State Administration"
 PVtown_administration_desc: "The state administration is the organized machinery of government, encompassing public institutions, agencies, and officials that implement laws, policies, and public services at national, regional, or local levels."
 pvurban_administration: "Urban Administration"
 pvurban_administration_desc: "Urban centers will become the beating heart of the country, hosting the majority of bureaucratic activities and administrative processes within their municipalities."
 pvrural_administration: "Rural Administration"
 pvrural_administration_desc: "The bureaucratic burden of the country is processed by the nobility, with the majority of bureaucratic activities and administrative being processed in their lands."
 pvcabinet_departments: "Cabinet Departments"
 pvcabinet_departments_desc: "The bureaucratic burden of the country is managed by Cabinet Departments, whose heads are nominated directly by the government. These departments manage daily government operations, host the majority of bureaucratic activities and administrative processes, and advise the Ruler on crucial policy areas."
 pvlocal_self_government: "Local Self Government"
 pvlocal_self_government_desc: "Bureaucratic and administrative activities are managed by local political entities."

 pv_serfstatus: "Land Reforms"
 pv_serfstatus_desc: "The laws governing agricultural land and the people who work it."
 pvpeasant_proprietorship: "Peasant Proprietorship"
 pvpeasant_proprietorship_desc: "Agricultural land is largely owned by independent peasant-proprietors, with a scattering of larger commercial estates."
 pvhomesteading: "Homesteading"
 pvhomesteading_desc: "Farmers are not tied to landlords anymore, and most of them own their own land."
 pv_tenantfarmers: "Tenant Farmers"
 pv_tenantfarmers_desc: "Agricultural land is owned by hereditary elites. Workers are not tied to the land, and may seek alternative employment if they can find it."
 pvmanorialism: "Manorialism"
 pvmanorialism_desc: "Agricultural land is owned by hereditary elites. Tenants are granted freedom of movement, but are obliged to perform unpaid labor for their landlords."
 pvserfdom: "Enforced Serfdom"
 pvserfdom_desc: "Peasants are tied to their land and must perform labor for their feudal masters."

 pv_devout: "Devout Society"
 pv_devout_desc: "Religious values are the social glue the keep our society united and strong."
 pv_clerical_adm: "Clerical Administration"
 pv_clerical_adm_desc: "Members of the Clergy are appointed in most of the offices of the State."
 holy_city_court: "Holy City Court"
 holy_city_court_desc: "Composed of the realm's leading nobles and clergy, the court elects the monarch, and operates under a unique set of laws compiled in the Assizes of Jerusalem."
 pvcrusader_council: "Haute Cour"
 pvcrusader_council_desc: "The Haute Cour acts as the supreme legislative, judicial, and executive body of the country, and it consists of the King's direct vassals, barons, and high-ranking church officials."
 pvassizes: "Assizes of Jerusalem"
 pvassizes_desc: "The Assizes of Jerusalem are a collection of numerous medieval legal treatises written in French containing the law of the crusader Kingdom of Jerusalem."
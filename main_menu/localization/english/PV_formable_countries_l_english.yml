l_english:
 BYZ_f: "Roman Empire" #PV
 BYZ_f_desc: "2090 years have passed since Romulus founded the city of Rome. Since then, Rome has defeated countless rivals, nearly succumbed to Carthage, emerged victorious, experienced civil wars, split first into four and then into two, seen the western parts of the empire fall to barbarians, reconquered some of them, and watched barbarians claim the emperorship of Rome. It has faced invasions, crusades, other civil wars, and yet, Rome still stands. The legacy of Rome has become such, that even if Constantinople was to fall today, Rome will live forever.\nRoma Invicta!"
 NSE_f: "High Kingdom of the North Sea" #PV
 NSE_f_desc: "The lands once owned by [GetCharacter('eng_cnut_the_great').GetName] extended over both sides of the [ShowAreaName('north_sea_area')], from [ShowRegionName('scandinavian_region')] to [ShowRegionName('great_britain_region')]. Although this territory has fragmented and reformed into different holdings over time, it has always been lying in wait, eagerly anticipating our rise and reclamation. It is time to establish this incredible empire once again, with all those lands coming together under our banner."

 tall_vs_wide: "Tall vs Wide"
 tall_vs_wide_desc: "A Tall Build emphasizes the development of a small territory, while a Wide Build relies on conquest as a means to achieve growth."
 tall_focus: "Tall Focus"
 wide_focus: "Wide Focus"
 # Fixing up Tinto's orientalism, like cmon it's 2026, open a history book
 LOADING_TIP_32: " #T \"The city is fallen, and I am still alive.\"#! \n #tooltip_subheading — Constantine XI, Last Roman Emperor, last words, 1453#!"
 LOADING_TIP_d008_2: " #T \"God forbid that I should live as Emperor without an Empire. As my city falls, I will fall with it.\"#! \n #tooltip_subheading — Constantine XI, Last Roman Emperor, 1453#!"
 LOADING_TIP_d008_1: " #T \"Better the Turkish turban than the Papal tiara.\"#! \n #tooltip_subheading — Loukas Notaras, Roman admiral, c. 1453#!"
 flavor_byz.1200.historical_info: "During the Roman Civil War of 1341 - 1347, the daughter of Emperor John VI Kantakouzenos, Theodora Kantakouzenos, married the Turkish Bey Orhan Gazi to help cement the alliance between the two countries, and ensure that the Ottomans would not change sides and start supporting John's rival, the Regent Empress Anna of Savoy."
 flavor_byz_1300_historical_info_shared: "The Roman policy for Constantinople has always been opening up the gates in order to populate the city's streets. After the Black Death had hit Constantinople, it had suffered tremendous losses, leaving many residences empty. The    emperors made efforts to restore the city, however they would not be enough, as the city's population would dwindle until its fall in 1453."
 flavor_byz.1503.historical_info: "Throughout the 14th century, the Aydinids, a Turkish Beylik based in western Anatolia, maintained a cordial yet complex relationship with the Roman Empire. Initially, they were involved in a series of alliances and confrontations with the Romans as they expanded their territory. At times, the Aydinid rulers cooperated with the Romans, serving as mercenaries or even allies against other Turkish Beyliks and the growing Ottoman Empire. However, this cooperation was often opportunistic and pragmatic, with both sides seeking to leverage the other's military strength for mutual benefit, such as crushing a neighboring foe."
 variable_tt_byz_continued_byzantine_renaissance_event: "The Roman Renaissance Flourishes"
 STATIC_MODIFIER_DESC_chastening_of_venice: "The pillaging and destruction suffered by the city of Venice as it came under Roman control has left a lasting mark upon it."
 flavor_byz.10.entry: "Donated To Rome donates to our cause"
 flavor_byz.21.historical_info: "Many of these poems are considered the start of Modern Greek Literature, some of which even became a symbol of Greek nationalism. One of these poems, and perhaps the most known, is the tale of Digenes Akritas, a border guard from both Greek and Arab descent, who protects the Roman Empire from the Arabs, and even slays mythical beings such as dragons." 
 flavor_byz.23.historical_info: "The Marbled Emperor has existed in many other cultures. For the Greeks, Konstantinos XI Palaiologos was perhaps one of the most renowned Emperors of the Roman Empire. It was said that during the siege of Constantinople in 1453 he did not die in the fight and would instead return one day to restore his empire."
 flavor_byz.24.historical_info: "In 1367, Emperor John V Palaiologos introduced a new coin, the Stavraton, which was named after the Greek word for \"Cross\", to defunct gold hyperpyron. This silver coin remained until the end of the Roman Empire."
 flavor_byz.25.historical_info: "Gemistos Plethon was one of the most renowned Rpman scholars. He advocated for the revival of Greek scholarship in Western Europe and wrote many manuscripts, many focusing on the revival of Hellenism and rejecting Roman law."
 flavor_byz.27.historical_info: "When the Palaiologos dynasty reclaimed Constantinople, they instituted a campaign of renovation for the city. That sparked the final period of development of Roman art, where it would slowly shift away from numerous Roman customs, such as the artists signing their works, and move towards a different style, the Palaeologan one, that would later on influence the Cretan School of art. 
 flavor_byz.31.entry: "Reforming the Roman Army"
 BYZ_NO_MORE_COURT_EVENTS: "The #Y Roman Court Influence#! [events|e] will no longer trigger."
 BYZ_COURT_EVENTS_WILL_CONTINUE: "The #Y Roman Court Influence#! [events|e] will continue triggering."
 byzantine_succ_crisis.11.historical_info: "During the Roman civil war of 1341, the empire was divided between the regency for the young John V Palaiologos and the claimant John VI Kantakouzenos. The conflict drew in Venice and Genoa, who used the war to advance their competing commercial interests. Genoa supported the pretender, hoping to secure trade dominance in the Black Sea and was rewarded with privileges and naval influence, particularly in Galata. Venice, determined to counter Genoese expansion, backed the regency. This turned the would-be civil war into a proxy struggle between the two maritime republics, further weakening Rome and deepening its dependence on foreign powers for naval and commercial matters."
 banking.3.desc: "Welser was a German merchant and banking family from Nuremberg and Augsburg, that claimed descent from the Roman general Belisarius. They provided a lot of the banking services to the growth of the Habsburg Empire, making them extremely wealthy. By the Age of Discovery, they had trading posts in Antwerp, Madrid, Lisbon, Rome, Lyon and many other cities."
 military_order_events.5.desc: "It has been so long since Crusader boots set foot in the Holy Land. Our knights, resolute and unwavering, have concluded a most prestigious campaign, the reclamation of the ancient city of [ShowLocationName('antioch')]. This storied city, perched on the shores of the Mediterranean, stands as a testament to centuries of diverse cultures and turbulent history. Its narrow, winding streets whisper tales of empires risen and fallen, from the Seleucids to the Romans. [ShowLocationNameWithNoTooltip('antioch')]'s strategic importance is unwavering, as it guards the eastern gateway to the Mediterranean and is a vital hub for trade and military control.\n\nAs a Military Order, we are driven by our relentless dedication to the defense of Christianity, determined to restore the city to its rightful hands. In the present moment, under the clear Syrian skies, our men march forth, their crimson cross banners fluttering in the wind, resolute in their quest to reclaim the rest of the Holy Land from the clutches of time, heathens and turmoil."
 military_order_events.5.a: "Our banners fly high over the city once again."
 rise_of_the_ottomans.600.historical_info: "The Ottoman Classical Era span approximately between 1453 and 1600. It marked the empire's peak in military, political, and cultural dominance. Under sultans like Mehmed II, Selim I, and Süleyman 'the Magnificent', the Ottomans expanded into Europe, the Middle East, and North Africa, defeating Romans, Mamluks, and Hungarians. Centralized governance, the #italic Kanunname#! legal system, and military innovations like the Janissaries solidified their rule. Istanbul flourished as an imperial capital, with grand mosques and cultural advancements. The empire controlled vital trade routes, dominated the Mediterranean, and claimed the Caliphate, asserting religious and political authority over the Islamic world."
 flavor_tre.3.historical_info: "The marriage between Irene and Basil was naught but a way for the Komnenoi dynasty to secure an alliance with the Emperor of Rome, as Irene was the illegitimate daughter of Emperor Andronikos III Palaiologos. There was no affection between the two; Irene produced no children, while Basil found refuge in the arms of a courtier mistress. The resentment between the royal couple eventually led to the assassination of Basil and the beginning of the reign of Irene, a turbulent period for Trebizond."
 flavor_tre.1.historical_info: "Founded in 756 BCE, Trebizond has a long history as a stronghold of Christianity and Greek culture. As far back as the Roman times, the city served as a crucial legionary base in Pontos Polemoniakos. Later on, during Justinian's reign, several Armenian campaigns used Trebizond as the rally and launching point.\n\nThe city evolved into an archbishopric in the 8th century and a metropolis in the early 10th century. The Empire of Trebizond, founded in 1204 by Alexios I Komnenos and David Komnenos, lasted until 1461, fortified by the Pontic Mountains, strong city defenses, and strategic marital alliances. Though small, with about 4,000 inhabitants in 1438, it was well-defended and featured significant monuments such as the monastery of Hagia Sophia and the Cathedral of Panagia Chrysokephalos. Trebizond was the last Roman outpost to fall to the Ottomans, maintaining its cultural and historical significance until 1461."
 flavor_ser.31.historical_info: "Stefan Dušan, also known as Dušan the Mighty, ascended to the throne as the Emperor of the Greeks and Serbs in 1346, marking a pivotal moment in Balkan history. Born in 1308, he initiated a rebellion against his father, King Stefan Uroš III Dečanski, ultimately becoming the King of Serbia in 1331. His ambitions transcended Serbian borders, leading to a successful campaign against the Roman Empire, then ruled by John VI Kantakouzenos. His coronation as Emperor in Skopje cemented his authority over a vast realm that extended from modern Croatia to southern Greece. Dušan furthered his independence by establishing the Serbian Orthodox Church, anchored by the Serbian Patriarch in Peja, and introduced the influential Dušan's Code, a comprehensive legal system drawing from Roman traditions. His reign signified a zenith of Serbian power, cultural influence, and territorial expansion, but after his death in 1355, the empire gradually fragmented and lost its earlier conquests, leaving behind a significant legacy in Serbian history."
 flavor_ser.30.historical_info: "Stefan Uroš IV Dušan was proclaimed Emperor in 1346, marking the zenith of medieval Serbian power. His reign was defined by military conquests and legal reforms that transformed Serbia into a dominant Balkan empire. Capitalizing on the weakening Roman Empire, Dušan expanded his realm to include large parts of Macedonia, Thessaly, and even Epirus. In a grand ecclesiastical assembly held in Skopje, he was crowned Emperor of the Serbs and Greeks, asserting both political supremacy and ecclesiastical independence by elevating the Serbian Archbishopric to a Patriarchate. This imperial proclamation symbolized Serbia's ambition to succeed Rome as the leading Orthodox Christian power in the region."
 flavor_rus.9.historical_info: "Not long before the Roman Empire collapsed, the Russian Church became, in effect, independent from the Patriarchate of Constantinople. Metropolitan Jonah, installed by the Council of Russian bishops, was given the title of Metropolitan of Moscow and All Russia. Ever since the Russian Church has been growing more and more independent of Constantinople, instead allying itself with the Russian state."
 flavor_mos.51.desc: "An elaborate skullcap, adorned with rubies, emeralds, and a gold overlay, has played a role in coronations for quite some time, yet its origin remains a subject of scholarly debate. Legend suggests that the cap was a gift from the Roman Emperors, though this claim stems from a folktale and lacks a reliable source. With the growing influence of the ruling elite and a continued need to reaffirm divine rule, an opportunity arises to shape the narrative and establish a unified version of the regalia's origin."
 flavor_mos.51.a: "Claim its origin from Rome."
 flavor_mos.33.desc: "The fall of [ShowLocationName('constantinople')] has presented us with the option of marrying into the former ruling class of [GetCountry('BYZ').GetName]. [sophia_palaiologina.GetName] hand in marriage would introduce the influences of Roman culture to court, strengthen our claim as the natural successor of the Roman Empire and torchbearer of the [ShowReligionAdjective('orthodox')] faith, and any offspring of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] would be able to claim their descent from the emperors of the fallen empire."
 flavor_mos.28.historical_info: "The original Dormition Cathedral of Moscow was constructed during the reign of Ivan I and quickly became the venue for important religious ceremonies, including the coronations of rulers. It would fall into disrepair and was subsequently rebuilt in the following century, to even more splendor and heavily influenced by Roman architecture."
 flavor_mos.11.tt3: "The teachings of his Roman master greatly enriches his skillset"
 flavor_mos.11.b: "Have him adorn our cathedrals."
 flavor_mos.11.tt4: "Working side by side with his Roman master significantly influences the development of [target_root_country.GetAdjective] religious art."
 flavor_mos.11.desc_common2: "His exceptional talent has been nurtured by the Roman scholar Theopanes the Greek, who originates from [ShowLocationNameWithNoTooltip('constantinople')], and it is believed that this influence has played a significant role in shaping his style of iconography\n\nHe resides at the [ShowWorkOfArtName('holy_trinity_st_sergius_lavra')], where he abides by the virtues set out by the monastery and continues to enrich its churches and cathedrals."
 flavor_mos.11.desc_byzantine_master: "$flavor_mos.11.desc_common1$\n\nHis exceptional talent has been nurtured by the Roman scholar Theopanes the Greek, who originates from [ShowLocationNameWithNoTooltip('constantinople')], and it is believed that this influence has played a significant role in shaping his style of iconography."
 flavor_lat.9.entry: "Papal Request Conversion of Roman Lands"
 flavor_lat.8.entry: "Old Roman Elite"
 flavor_gen.16.desc: "The island of [ShowLocationName('chios')] was home to the Lordship of Chios, which was subject to the [ROOT.GetCountry.GetLongName] from 1304 until its fall in 1329. The crumbling [GetCountry('BYZ').GetLongName] reclaimed the island for themselves once again in 1329 after the local Zaccaria family antagonized the local Greek population. Ever since, the island was thought to be lost to the Roman until a new civil war started.\n\nAs their government was occupied with their infighting, the cunning members of the Maona of Chios and Phocaea secured the island from the Greeks. Now Chios has returned to [ROOT.GetCountry.GetAdjectiveWithNoTooltip] hands."
 flavor_flo.35.desc: "Originally in a tour alongside Roman scholars since 1394, [target_artist.GetName] has traveled far and wide across many courts in Europe, translating the works of Homer and Plato, while also teaching Greek to many aristocrats who can afford his services. His latest stop is our court in [target_location.GetName] has fascinated him enough and convinced him to send a petition to our advisors. He wishes to be employed in our court and spread his knowledge and translations freely within [target_location.GetNameWithNoTooltip]."
 flavor_eth.140.desc: "The #italic Fetha Negest#!, also known as the #italic Justice of the Kings#!, is a theocratic legal code compiled around 1240 in Arabic by Abu'l-Fada'il ibn al-Assal, an Egyptian Christian writer. He drew his laws from apostolic writings and previous law codes of Roman rulers.\n\nThe textual history of the #italic Fetha Negest#! reveals its two distinct parts. The first part primarily focuses on ecclesiastical matters, detailing the structure of the Church hierarchy and sacraments. It incorporates elements from the Bible, works of early Church fathers like St. Basil and St. Hippolytus, as well as canons established at councils such as the Council of Nicaea and the Council of Antioch.\n\nThe second part of the #italic Fetha Negest#! addresses issues pertaining to the laity, including family law, debt, and civil administration. While drawing from the same sources as the first part, it is largely attributed to four books collectively known as the #italic Canons of the Emperors#!. These books include the #italic Procheiron#! (also known as #italic Procheiros Nomos#!), the Arabic version of the #italic Syro-Roman Law Book#!, the Arabic version of the #italic Ecloga#!, and the #italic Precepts of the Old Testament#!.\n\nFor centuries, the #italic Fetha Negest#! has served as an authoritative legal guide for the [ShowReligionAdjective('miaphysite')] Christians of [ShowRegionName('egypt_region')]. It has now been translated to [ROOT.GetCountry.GetCulture.GetLanguage.GetName] in [ShowRegionName('ethiopia_region')] and expanded upon with additional local laws. Some judges in our realm wonder if we should adopt it and most among the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] support this action."
 flavor_eng.92.historical_info: "In December 1400, the Roman emperor traveled to England to meet King Henry IV. It was part of a diplomatic offensive to rally support against the growing threat of the Ottoman Empire, which was dangerously close to conquering the city of Constantinople, the capital of Rome. The visit was a moderate success but failed to secure enough funds to shore up the empire's fortunes."
 flavor_bul.1001.historical_info: "Historically, many powers coveted Constantinople, and Bulgaria was no exception. Over the centuries, several Bulgarian rulers attempted to bring the great city under their control, yet none succeeded. The most notable effort came during the reign of Simeon the Great. Though the city itself remained unconquered, the war nevertheless ended in a profound Roman humiliation. The empire was compelled to recognize Simeon’s imperial title, acknowledging him as Tsar and effectively elevating Bulgaria to the rank of a great power in the Balkans."
 flavor_ayd.1.historical_info: "Umur Ġāzī is one of the most well-known Anatolian privateers. Mustering a powerful army and navy, his adventures across the Aegean have become the stuff of legends. His privateering activities led to a crusade being declared against his domain. Such was his military importance that he came to the aid of Roman Emperor John Cantacuzenus, where the Lion played a crucial role in the Roman civil war (1341-1347) by providing significant military support, including 380 ships and 28,000 soldiers."
 flavor_ath.9.entry: "Roman Internal Strife"
 STATIC_MODIFIER_NAME_expensive_greek_studies_modifier: "Expensive Roman Studies"
 STATIC_MODIFIER_NAME_orthodox_latin_studies_modifier: "Orthodox Latin Studies"
 STATIC_MODIFIER_NAME_orthodox_greek_studies_modifier: "Orthodox Roman Studies"

 STATIC_MODIFIER_NAME_diplomatic_greek_studies_modifier: "Diplomatic Roman Studies"
 STATIC_MODIFIER_NAME_military_latin_studies_modifier: "Military Latin Studies"
 STATIC_MODIFIER_NAME_military_greek_studies_modifier: "Roman Military Studies"
 STATIC_MODIFIER_NAME_greek_influenced_upbringing_modifier: "Roman-Influenced Upbringing"
 a_byzantine_cataphracts: "Roman Cataphracts"
 a_byzantine_cataphracts_desc: "A powerful body of heavily armored knights, the Cataphracts make up the elite of our cavalry units. Armed with a short lance named 'kontos' and covered in scale armor, these troops strike fear at the heart of our enemies. A whirlwind of steel in the form of an unstoppable wave of horsemen delivers the killing blow to all those who seek to trample our people."
 a_byz_helepolis_cannon_unit: "Modernized Helepolis"
 a_byz_helepolis_cannon_unit_desc: "The Helepolis has served many Roman emperors in the past. With the introduction of gunpowder and the advent of new siege machines of warfare, the city-taker artillery has now embraced its new deadly form."
 STATIC_MODIFIER_NAME_lat_end_of_byzantine_culture: "End of Roman Culture" 
 STATIC_MODIFIER_NAME_lat_byzantine_inspired_bureaucracy: "Roman-Inspired Bureaucracy"
 STATIC_MODIFIER_NAME_byzantine_influx: "Roman Influx"
 seek_relations_with_the_byzantines_price: "Seek Relations with the Roman Price"
 TUR_scenario_desc: "The #W Ottomans#! are consolidating their position as one of the most powerful #italic Beyliks#!, the Turkish warlords, on the rise, eager to secure vital territories along the Bosphorus coast and the Anatolian highlands. There have been some recent conquests along the border with Rome, which stands as the main enemy for the West to defeat. Gaining dominance over the neighboring #italic Beyliks#! would considerably increase the resources needed for future victories."
 antagonism_ach_byzantine_civil_war_intervention: "Sowed Chaos in Rome"
 MODIFIER_TYPE_NAME_seek_relations_with_the_byzantines_price_cost_modifier: "Seek Relations with the Rome Cost Modifier"
 athens_desc: "Considered the cultural centre of Ancient Greece, Athens grew to be one of the mightiest city states of its time. Being at odds with Sparta, Thebes, and other states of antiquity, it slowly grew to be the dominating maritime power of the Aegean Sea. With its subjugation under the Macedonian Empire, and later on the Roman Empire, the city faced a major decline, and after 1204, the head of a Crusading State."
 thessaloniki_desc: "Long regarded as the second city of the Roman Empire after Constantinople, Thessaloniki's wealth and prestige stem from her strategic position in commerce. Her bustling ports channel valuable goods between Italy and the Roman heartland, serving as a vital bridge between East and West."
 byzantine_law: "Late Roman Law"
 byzantine_law_desc: "Late Roman law, evolving from Roman law with Christian and Hellenistic influence, largely derives from Justinian's #italic Corpus Juris Civilis#!, which emphasizes ceremonial emperor roles, and reflects philosophical and religious ideals."
 fetha_negest_policy: "Fetha Negest"
 fetha_negest_policy_desc: "The #italic Fetha Negest#!, or Justice of the Kings, is a theocratic legal code compiled by Abu'l-Fada'il ibn al-Assal, and is a significant work of justice. Drawing from apostolic writings and Late Roman law codes, it encompasses ecclesiastical and secular matters, and is further influenced by Roman law."
 byzantine_succession: "Roman Succession"
 byzantine_succession_desc: "A complex system of succession that combines elements of primogeniture and elective monarchy, allowing for a more flexible approach to choosing a ruler while still maintaining a connection to the imperial lineage."
 bashtinas_and_pronijas_grants_desc: "The system of land grants for our elites is inspired by the Roman system of #italic Pronoias#!. It grants them a grand array of privileges and obligations on behalf of their domains when it comes to administering the lands leased to them by the government."
 russian_group_desc: "The Rus' people trace their origins to the Varangians, Scandinavian seafarers and warriors who settled in the Russian region around the 9th century. Over time, the Rus' underwent a process of cultural fusion, blending Slavic traditions with Scandinavian influences. Proximity to the Roman Empire promoted cultural and economic exchanges, contributing to their unique culture with a diverse mix of art, architecture, and language."
 italian_group_desc: "Italy, a vibrant patchwork of realms and city-states, is a melting pot of cultures and influences. From the ancient Romans to the Lombards, and Normans, various peoples have left their mark on the Italian Peninsula. Italians compete fiercely for power and prestige, fostering a flourishing culture and artistic patronage."
 euphrasian_basilica_desc: "Erected in the 6th century in the coastal city of Poreč by Bishop Euphrasius, this grand early Christian basilica replaced an earlier church and became a showcase of Roman art in the Adriatic region. Its interior is dominated by an apse mosaic depicting Christ enthroned among saints and martyrs, surrounded by shimmering gold tesserae and vivid figures that convey divine majesty and serene authority."
 boyana_church_frescoes_desc: "Painted in 1259, these medieval murals adorn the small Boyana Church near $ORIGIN$. They mark a breakthrough in Roman art, anticipating Renaissance humanism with individualized portraits and dynamic compositions, and represent diverse religious figures, including Christ and the Virgin. These frescoes stand out for their lively realism, subtle modeling of faces, expressive gestures, and a sense of individual character that gives the figures an almost lifelike presence, marking a significant artistic advance in the medieval Balkans."
 aachen_cathedral_desc: "Commissioned by Charlemagne around 796, the Cathedral of $ORIGIN$ (Aix-la-Chapelle) is a masterpiece of Carolingian architecture and one of Europe's earliest monumental domed churches. It served as the coronation site for German kings from 936 to 1531. The Palatine Chapel's octagonal plan and mosaics drew inspiration from Ravenna and Rome. In the 14th century, it still stood as a major relic of imperial power and a center of pilgrimage for Charlemagne's remains."
 song_of_armouris_desc: "The tale of one of the greatest Akritais. The #italic $song_of_armouris$#! is the most famous of these Roman chivalric stories, following Armouris Armouropoulos, a man of Herculean strength who slew the Saracens in the thousands to avenge his father."
 saint_mark_basilica_desc: "The $saint_mark_basilica$ centered in the Saint Mark's Square in [ShowLocationName('venice')] is a religious building of Roman and Gothic styles that holds the remains of Saint Mark the Evangelist."
 annunciation_ustyug_desc: "The $annunciation_ustyug$, painted in the 12th century, is one of the earliest surviving examples of Russian Orthodox iconography. It reflects the Roman influence on Kievan Rus' art and the spread of Christian teachings."
 acritic_songs_desc: "A compilation of Acritic Songs. They contain tales of heroes such as Digenes Akritas and Andronicus, men during the Arab-Roman Wars, going on adventures against the Arab invaders, protecting the Roman frontier and earning personal glory."
 reforms_of_the_peloponnese_desc: "Plethon's concept of the perfect Roman Empire. Instead of relying on the Code of Justinian, it urges the return of a more classical society, one inspired by the Peloponnesians. Turning the peninsula into a cultural paradise, it also urges the burning of homosexual and sexual deviants, directly inspired by Plato's #italic Republic#!."
 nomoi_desc: "Although much of its writings have been lost, there are still remnants of Plethon's ideal society. Much of it remains unknown, but it is safe to assume that it is directly inspired by Zoroastrianism and Stoicism."
 nomoi_directors_cut_desc: "Taking inspiration from Zoroastrianism and Stoicism, #italic Nomoi#! contains the plans of Gemistos Plethon as to how the Roman society should be. Instead of the Patriarchy being in charge, there should be a new faith, one with a hierarchical pantheon. Communities should be created, the monarch should be be a benevolent one, land should be owned by the people, and there should be divisions between gender and classes."
 history_of_the_palaiologoi_desc: "A chronicle that contains the history of the Palaiologos dynasty, from its very humble origins in Roman Italy, to its ascendance in the Roman Empire during the Empire's restoration. Of course, some of these records are considered exaggerated, but there is no proof that they did not happen."
 moe_the_constitution_of_morea_advance_desc: "As the wave of Enlightenment sweeps across the Mediterranean, the despots of the Morea have taken the radical step of formalizing the relationship between the throne and the people through a written charter. This document, heavily influenced by the social theories of the Mystras Academy, dismantles the last vestiges of Roman courtly favoritism in favor of a meritocratic civil service and protects property rights for the burgeoning merchant class. By granting the citizenry a stake in the governance of the state, the Despotate fosters an intense national loyalty that makes the population far more resistant to foreign subversion. This political modernization will transform the Morea from a traditional autocracy into a sophisticated 'National Monarchy', capable of mobilizing the full psychological and financial resources of its people for the glory of the state."
 ths_raiders_of_the_pindus_advance_desc: "Survival in Northern Greece requires a departure from traditional Roman field tactics in favor of a sophisticated system of partisan warfare. The Thessalian military doctrine will evolve to focus on #italic Klephthic#! tactics, utilizing the deep ravines and dense forests of the Pindus mountains to bleed enemy supply lines dry through constant harassment. This cultural shift toward guerilla resistance meant that any occupying force will face a landscape where every shepherd is a scout and every mountain path a potential ambush site, making the conquest of Thessaly a logistical nightmare for foreign empires."
 feo_black_sea_fur_trade_advance_desc: "Despite our small size, we control the vital ports that connect the vast fur-producing forests of Russia to the markets of the Mediterranean. We have negotiated exclusive rights with the local Tatar Khans to be the sole shippers of these furs across the Black Sea. This lucrative monopoly provides us with the wealth necessary to pay for Genoese engineers and Roman scholars, ensuring our tiny principality remains a center of wealth and sophistication amidst the steppe."
 gre_rebuilding_the_theme_system_advance_desc: "We have looked to the golden age of the Middle Roman period to solve our manpower crisis. By granting hereditary land plots to #italic Akritai#! (border guards) in exchange for perpetual military service, we create a self-sustaining defense force deeply rooted in the soil they protect. This system reduces our reliance on expensive mercenaries and ensures that every province has a dedicated militia capable of holding the line until the main imperial army arrives."
 moe_reclaiming_the_peloponnese_advance: "Reclaiming the Peloponnese"
 moe_reclaiming_the_peloponnese_advance_desc: "Following the Roman recovery of the forts of Monemvasia, Maina, and Mystras, the Despotate of the Morea has dedicated itself to a long 'reconquista' of the peninsula from the Frankish Principalities. This campaign is not merely one of siegecraft, but of cultural subversion, as the Greek administration encourages the local population to rise against their Latin lords in favor of the 'rightful ruler'. Through a combination of strategic marriages, persistent skirmishing, and the gradual absorption of feudal fiefs, the Morea slowly knits together a fractured land into a cohesive province."
 ths_meteora_sanctuaries_advance: "Meteora Sanctuaries"
 greek_group_stratioti_levies_advance_desc: "The rugged landscape of the Balkans has birthed a unique class of warrior: the Stratioti. These light cavalrymen, often wearing a mix of Roman armor and local attire, are masters of the 'hit and run' tactics necessary to harass larger, slower Western or Ottoman armies. Their reputation for ferocity and scouting excellence makes them indispensable, turning the tide of mountain battles where heavy knights flounder. They are the vanguard of a Greek military resurgence."
 ath_thebes_textiles_advance_desc: "The workshops of Thebes, already renowned in Roman times for their silk-weaving, have flourished anew under Frankish rule as the dukes of Athens encourage Italian merchants to invest in looms, dyeworks, and export networks that carry Theban samites and velvets to markets from Bruges to Alexandria; this revival of luxury textile production, combined with the fertile plains of Boeotia that supply raw materials, generate substantial wealth that funds castle-building, knightly retinues, and the lavish lifestyle of the Athenian court, ensuring that the duchy remains one of the richest and most economically sophisticated territories of the entire Frankokratia."
 ach_morean_silk_advance_desc: "The Peloponnese remains the heart of European silk production, a legacy of the Roman era that the Frankish Princes have expanded through state-sponsored mulberry groves. By controlling strategic ports, we can undercut the high prices of Persian and Chinese imports, making Achaea the primary supplier for the garment makers of Florence and Lyon. This monopoly provides a steady stream of #italic soft gold#! that funds our mercenaries and the fortification of our mountain passes."
 ath_the_catalan_company_advance_desc: "After being hired and then betrayed by the Roman emperor, the ferocious Catalan Grand Company turned against their former paymasters and, in 1311, annihilated the Frankish duke Walter V of Brienne at the Battle of the Cephissus, seizing control of the Duchy of Athens and establishing a period of Catalan rule. These battle-hardened Almogàvers introduced a more ruthless mercenary ethos to Greek affairs, fortifying key strongholds, extracting tribute from the countryside, and maintaining their grip through a combination of terror and disciplined infantry tactics until internal strife and Aragonese intervention eventually shifted power back toward a more conventional feudal regime."
 frankokratia_the_latin_enlightenment_advance_desc: "The centuries of struggle have culminated in a unique Eastern European Enlightenment, where the crusading spirit has been replaced by a rationalist, imperialist drive for order. The Frankokratia states are no longer 'crusader outposts' but are now a sophisticated, unified block of powers that blend Western technology with Eastern strategic depth. We have become the definitive bridge between civilizations, a 'Third Way' that is neither purely Western nor purely Roman, but something entirely new."
 frankokratia_frankokratia_advance_desc: "The original division of the Roman Empire in 1204 remains our legal foundation, granting us permanent, divinely sanctioned claims on the remnants of the Greek world. We do not view ourselves as conquerors, but as the rightful heirs to the fiefs assigned to our ancestors by the Latin Emperor and the Venetian Doge. This legal certainty allows us to pursue a relentless policy of expansion and reclamation against any local lords who refuse to acknowledge our feudal suzerainty."
 serbian_the_icon_of_saint_sava_desc: "The cultural foundation of the Serbian people is defined by Saint Sava. By blending Roman spirituality with local Slavic customs and a fierce commitment to the Serbian language in liturgy, Sava created a national church that is inseparable from the people's identity. This cultural anchor resurfaces again among our people and ensures that all Serbians, whether nobles or peasants, view themselves as part of a distinct, sacred community that remains unified even when political borders shift or collapse, providing an internal stability that resists foreign cultural assimilation."
 revival_of_the_literary_schools_desc: "Under the direct patronage of the Shishman Dynasty, the nation has undergone a spectacular cultural growth, positioning itself as a true #italic Third Rome#! and the primary guardian of Orthodox high culture. By funding the reconstruction of the Patriarchal Cathedral and the royal palaces of Tsarevets, the state has gathered a new generation of master iconographers, hagiographers, and architects who blend traditional Roman aesthetics with a unique, emotive Bulgarian realism. This school of thought does not merely produce religious icons; it serves as a powerful instrument of imperial propaganda, codifying the Bulgarian recension of Church Slavonic and producing the Manasses Chronicle to legitimize the Tsar's claim to the Roman heritage."
 bos_bosnian_ljekaruse_desc: "In the secluded valleys of our nation, monks of our monasteries have compiled the #italic Ljekaruše#! — extensive medicinal codices written in the native #italic Bosančica#! script. By synthesizing ancient Greco-Roman theory with the high-altitude herbalism of the Dinaric Alps, these manuals provide a sophisticated system of community healthcare in an era where professional physicians are a rarity. This mastery of folk-medicine and surgery ensures our population remains resilient against the plagues that devastate the lowlands, fostering a cultural identity defined by intellectual self-reliance and the preservation of Slavic scientific knowledge."
 thp_mecenas_of_the_arts_desc: "We have funded the construction of grand cathedrals and fortifications, blending Gothic and Roman styles to showcase our wealth and piety. This architectural splendor serves to legitimize our rule in the eyes of the Church and our subjects, turning our cities into symbols of permanence."
 mzk_the_muzaka_chronicle_desc: "Our family keeps meticulous and grand records of our history and territorial rights, ensuring our ancient claims are never forgotten. This literary tradition preserves our high Roman titles, overawing local rivals with our imperial dignity and historical depth."
 mzk_the_despots_of_berat_desc: "Ruling from the Castle of Berat, the 'City of a Thousand Windows', we represent the peak of Albanian urban sophistication and Roman-style administration. Our court serves as a magnet for scholars and artisans, turning our capital into a beacon of culture that rivals the grand cities of the East."
 alb_eastern_and_western_heritage_desc: "Our urban centers continue to operate under both the sophisticated principles of Roman Law and the modern bureaucracies of the West. This legal continuity provides a stable framework for contracts, property rights, and inheritance that attracts foreign merchants and scholars to our courts. A predictable legal system is the foundation of our growing administrative strength."
 alb_angevin_legitimacy_desc: "Our latest crowned heads can be traced directly to the lineage of the Capetian House of Anjou, specifically established by Charles I of Naples to serve as his gateway into the Roman heartlands. This connection grants us a unique Western prestige among the fragmented Balkan lords, allowing us to claim a seat at the table of the great Catholic monarchs of Europe. By upholding the honors and heraldry of the Lily, we distinguish our sovereignty from that of mere tribal chieftains."
 rmn_the_byzantine_heirs: "The Roman Heirs"
 rmn_the_byzantine_heirs_desc: "Inspired by the glory of Constantinople, the Romanian princes have bound themselves to be the primary patrons of Mount Athos and the Orthodox East. By positioning ourselves as heirs to the Roman cultural legacy, we attract scholars and artists from across the Balkans. Romania is now 'more Rome than Rome', the faith capital of the Orthodox world."
 romanian_the_foundation_of_the_voivodeship_tradition_desc: "The transition from tribal knezes to the centralized office of the Voivode signals the maturation of Romanian political culture into a sophisticated medieval system. This #italic Dux#! or military leader model is adapted from both Slavic and Roman influences but is uniquely Romanian in its execution, blending elective monarchy with dynastic continuity. It will provide the community with a clear military hierarchy capable of negotiating with the neighboring crowns as sovereign equals."
 ACHIEVEMENT_there_can_be_only_one: "There Can Be Only One"
 ACHIEVEMENT_DESC_there_can_be_only_one: "Either as the HRE Emperor destroy the Roman Empire while owning Constantinople, or as the Roman Empire dismantle the HRE while owning Aachen."
 ACHIEVEMENT_belisars_legacy: "Belisar's Legacy"
 ACHIEVEMENT_DESC_belisars_legacy: "As Rome, restore Justinian's Borders and Mend the Schism."
 fate_of_the_phoenix_key: "#italic Fate of Rome#!"
 fate_of_the_phoenix_dlc_desc: "2090 years have passed since Romulus founded the city of Rome. Since then, Rome has defeated countless rivals, nearly succumbed to Carthage, emerged victorious, experienced civil wars, split first into four and then into two, seen the western parts of the empire fall to barbarians, reconquered some of them, and watched barbarians claim the emperorship of Rome. It has faced invasions, crusades, other civil wars, and yet, Rome still stands.\nThe legacy of Rome has become such, that even if Constantinople was to fall today, Rome will live forever.\nRoma Invicta!"
 ACHIEVEMENT_DESC_reborn_from_the_ashes: "Win the Fate of the Rome disaster."
 TITLE_FATE_OF_THE_PHOENIX: "#credits_title Fate of Rome#!"
 fate_of_the_phoenix: "Fate of Rome"
 fate_of_the_phoenix.1.title: "The Fate of Rome"
 fate_of_the_phoenix.14.title: "Resurgence of Rome"
 fate_of_the_phoenix.11.desc: "Our [target_unit.GetName] has achieved a great victory over an army led by [target_losing_country.GetName], at [target_location.GetName]. News of the triumph spreads swiftly, renewing confidence that the Eagle yet endures. [target_character.GetShortName] is well on [target_character.GetHerHis] way to become a legendary figure."
 latinization_vs_hellenization_desc: "A [country|e] embracing $latinization_focus$ looks to the powers of the Latin West—Italian republics, Frankish courts, and the currents of the Renaissance—for support, partnership, and renewal through diplomacy and selective accommodation. One rooted in $hellenization_focus$ holds fast to its unbroken Roman inheritance, upheld by the Orthodox faith, the institutions of the imperial administration, and the enduring tradition of Rome.
 flavor_tre.8.historical_info: "The Grand Komnenoi of Trebizond were founded in 1204 by Alexios I Komnenos, a grandson of the Roman Emperor Andronikos I. Throughout their existence, the Trapezuntine emperors bore the title of Emperor of the Romans and regarded themselves as the rightful successors to the Roman imperial legacy. Constantinople, the legendary seat of the Eastern Roman Emperors, was not merely a political prize but the spiritual and cultural heart of a civilization stretching back a millennium."
 cb_restore_roman_borders_desc: "The splendor of the old Empire calls to us. It is time for the eagle to spread its wings, dooming all those who dare stand between us and our ambition to restore the [ShowScriptedGeographyName('roman_borders_geography')] of old."
 flavor_ach.11.entry: "Exploit the Roman Civil war"
 flavor_ach.11.desc: "Although [ROOT.GetCountry.GetAdjective] spies in the [byz_country.GetGovernment.GetCourtTitle] of [byz_country.GetName] have brought back rumors of political instability for some time now, recent reports speculate that [byz_country.GetAdjectiveWithNoTooltip] [byz_country.GetGovernment.GetEstateName('nobles_estate')] have grown infuriated with the ruling [byz_ruler.GetDynasty.GetName], and are now plotting a coup.\n\nSeeing this as a prelude to a potential civil war within [byz_country.GetNameWithNoTooltip], some have urged [scope_ruler.GetName] to make preparations to exploit the situation."
 flavor_ach.11.a: "Now is the time to crush Rome!"
 flavor_byz.8.a: "The Eagle rises!"
 towns_and_cities_anatolia_get_pop_growth_tt: "[towns_and_cities|e] we own across [ShowRegionNameWithNoTooltip('anatolia_region')] will benefit from the [ShowModifier('repopulation_of_anatolia_modifier')] [modifier|e] for #Y 10#! years"
 flavor_byz.18.desc: "With the fall of [GetCountry('BYZ').GetName], the [ShowCultureName('greek_culture')] world has been shaken. After months and months of being at the mercy of [target_country.GetName], the walls of [target_location.GetName] have fallen. The [target_country.GetAdjectiveWithNoTooltip] forces stormed the city and sacked it, cutting deep into the [ShowCultureNameWithNoTooltip('greek_culture')] population all around the globe. Although the eagle is now gone, much of our populace has been wounded by this news, primarily the communities in [target_location2.GetName]."
 fate_of_the_phoenix.14.title: "Resurgence of the Eagle"
 fate_of_the_phoenix.11.desc: "Our [target_unit.GetName] has achieved a great victory over an army led by [target_losing_country.GetName], at [target_location.GetName]. News of the triumph spreads swiftly, renewing confidence that Rome yet endures. [target_character.GetShortName] is well on [target_character.GetHerHis] way to become a legendary figure."
 fate_of_the_phoenix.6.a: "Rome does not concern itself with trivial complaints."


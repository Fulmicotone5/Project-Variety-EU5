 daneflavor.6.desc: "[ShowLocationName('derby')], one of the five founding boroughs, has, after decades of neglect by the [ShowCultureName('english')] authorities, been reduced to an abandoned and forgotten land. Fortunately, a group of merchants from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] has assembled nearly sufficient funds to undertake the restoration of the town and restore it to its former glory; however, they require a modest contribution from the state to initiate the project."

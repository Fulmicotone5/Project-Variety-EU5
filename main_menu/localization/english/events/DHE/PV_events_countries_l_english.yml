l_english:

 daneflavor.1.title: "The Last Norse Bastion"
 daneflavor.1.desc: "Initially established as an administrative region under the Kingdom of Denmark, the [ROOT.GetCountry.GetName] has gradually evolved into a de facto independent entity, particularly following the Danish monarch's abandonment of our traditional religion. Historically, the [ROOT.GetCountry.GetName] was centered around five key [ShowLocationName('lincoln')], [ShowLocationName('leicester')], [ShowLocationName('derby')], [ShowLocationName('nottingham')], and [ShowLocationName('rutland')]—that served as cultural and administrative hubs, forming the backbone of the region's strength.\nHowever, following numerous conflicts, only [ShowLocationName('lincoln')], our capital, remains as the sole remaining borough.\nThe reconquest of our stolen territory constitutes the first step toward reestablishing ourselves as the sovereign rulers of this land."
 daneflavor.1.a: "May the gods assist us in this endeavor"

 daneflavor.2.title: "The Birth of a New Kingdom"
 daneflavor.2.desc: "The five founding boroughs of [ROOT.GetCountry.GetName] have been successfully restored, and these cities will now serve as the cultural and political centers of the nation.\nWith the reclaiming of its territory, the country is prepared to transition from an aspirational state to a duly established kingdom.\nToday marks the birth of a new Kingdom, the Kingdom of [ROOT.GetCountry.GetName]."
 daneflavor.2.a: "Long Live [ROOT.GetCountry.GetName]!"

 daneflavor.3.title: "Lincún has Fallen!"
 daneflavor.3.desc: "Lincún, or [ShowLocationName('lincoln')] as the [ShowCultureName('english')] call it, was a key [ROOT.GetCountry.GetAdjective] city of the [ROOT.GetCountry.GetName] for centuries before finally being lost to the invasor.\nMay the Gods have mercy!"
 daneflavor.3.a: "Hard times are ahead of us"
 daneflavor.4.title: "Rebuilding [ShowLocationName('leicester')]"
 daneflavor.4.desc: "[ShowLocationName('leicester')], one of the five founding boroughs, has, after decades of neglect by the [ShowCultureName('english')] authorities, been reduced to an abandoned and forgotten land. Fortunately, a group of aristocrats from the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] has assembled nearly sufficient funds to undertake the restoration of the town and restore it to its former glory; however, they require a modest contribution from the state to initiate the project."
 daneflavor.4.a: "[ShowLocationName('leicester')] shall be restored!"
 daneflavor.4.b: "We cannot afford that."
 daneflavor.4.c: "Those funds will better used in the hands of the state."
 daneflavor.5.title: "Rebuilding [ShowLocationName('nottingham')]"
 daneflavor.5.desc: "[ShowLocationName('nottingham')], one of the five founding boroughs, has, after decades of neglect by the [ShowCultureName('english')] authorities, been reduced to an abandoned and forgotten land. Fortunately, a group of aristocrats from the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] has assembled nearly sufficient funds to undertake the restoration of the town and restore it to its former glory; however, they require a modest contribution from the state to initiate the project."
 daneflavor.5.a: "[ShowLocationName('nottingham')] shall be restored!"
 daneflavor.5.b: "We cannot afford that."
 daneflavor.5.c: "Those funds will better used in the hands of the state."
 daneflavor.6.title: "Rebuilding [ShowLocationName('derby')]"
 daneflavor.6.desc: "[ShowLocationName('derby')], one of the five founding boroughs, has, after decades of neglect by the [ShowCultureName('english')] authorities, been reduced to an abandoned and forgotten land. Fortunately, a group of merchants from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] has assembled nearly sufficient funds to undertake the restoration of the town and restore it to its former glory; however, they require a modest contribution from the state to initiate the project."
 daneflavor.6.a: "[ShowLocationName('derby')] shall be restored!"
 daneflavor.6.b: "We cannot afford that."
 daneflavor.6.c: "Those funds will better used in the hands of the state."
 daneflavor.7.title: "Rebuilding [ShowLocationName('rutland')]"
 daneflavor.7.desc: "[ShowLocationName('rutland')], one of the five founding boroughs, has, after decades of neglect by the [ShowCultureName('english')] authorities, been reduced to an abandoned and forgotten land. Fortunately, a group of merchants from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] has assembled nearly sufficient funds to undertake the restoration of the town and restore it to its former glory; however, they require a modest contribution from the state to initiate the project."
 daneflavor.7.a: "[ShowLocationName('rutland')] shall be restored!"
 daneflavor.7.b: "We cannot afford that."
 daneflavor.7.c: "Those funds will better used in the hands of the state."
 daneflavor.8.title: "A New Capital?"
 daneflavor.8.desc: "Numerous members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] have articulated their aspiration for the [ROOT.GetCountry.GetName] to establish hegemonic dominance over the North Sea, while also noting that [ShowLocationName('london')] would geographically serve as a more advantageous location to advance such ambitions."
 daneflavor.8.a: "[ROOT.GetCountry.GetCapital.GetName] shall remain the capital!"
 daneflavor.8.b: "Why not [ShowLocationName('boston')]?"
 daneflavor.8.c: "And so [ShowLocationName('london')] shall become the new capital!"
 daneflavor.9.title: "The Festival of [ROOT.GetCountry.GetCapital.GetName]"
 daneflavor.9.desc: "The streets burst into vibrant colors with blooming flowers and cheerful banners, as townsfolk and [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] alike don their most dazzling costumes to revel in lively feasts, playful jesters, and captivating stories. Markets overflow with beautiful crafts, fragrant spices, and delicious local treats, filling the air with joyful energy and a warm sense of community celebration."
 daneflavor.9.a: "Let's rejoice!"
 daneflavor.9.b: "Don't spare any expense!"
 daneflavor.10.title: "The Fire of [ShowLocationName('london')]"
 daneflavor.10.desc: "A devastating blaze that started in a bakery on Pudding Lane is sweeping through the City of [ShowLocationName('london')]. Flames quickly engulfed timber-framed buildings, spreading rapidly due to strong winds and dry conditions. The fire is destroying many homes, leaving hundreds homeless."
 daneflavor.10.a: "There is nothing we can do"
 daneflavor.10.b: "Send all the help possible!"
 daneflavor.11.title: "Norse Refugees Leave [GetCountry('NOL').GetName]"
 daneflavor.11.desc: "The refugees, carrying their belongings and desperate hope for safety, traverse treacherous paths through the Anglian countryside, seeking refuge within the city walls of [ShowLocationName('lincoln')]."
 daneflavor.11.a: "Welcome them!"
 daneflavor.12.title: "Norse Refugees Leave [GetCountry('ENG').GetName]"
 daneflavor.12.desc: "The refugees, carrying their belongings and desperate hope for safety, traverse treacherous paths through the [ShowCultureName('english')] countryside, seeking refuge within the city walls of [ShowLocationName('lincoln')]."
 daneflavor.12.a: "Welcome them!"
 daneflavor.13.title: "The High Kingdom of the North Sea"
 daneflavor.13.desc: "With the restoration of the High Kingdom of [ROOT.GetCountry.GetName], we have achieved a monumental milestone that revitalizes Norse heritage and sets the stage for a new era of prosperity and unity.\nThe resurgence of the Kingdom serves as a beacon of pride, inspiring collective efforts to strengthen alliances, cultivate trade, and embrace a shared identity rooted in history while navigating the complexities of the modern world."
 daneflavor.13.a: "Long Live the High Kingdom of [ROOT.GetCountry.GetName]!"
 daneflavor.14.title: "The the High Kingdom of [ROOT.GetCountry.GetName]"
 daneflavor.14.desc: "At long last, all the Norse people have been united under one banner\nThis achievement not only empowers us as a central player in the world politics but also reinvigorates cultural and social connections among the norse people."
 daneflavor.14.a: "Long Live the High Kingdom of [ROOT.GetCountry.GetName]!"
 daneflavor.15.title: "[ShowLocationName('leicester')] and [ShowLocationName('rutland')] Reclaimed!"
 daneflavor.15.desc: "Lost to the [ShowCultureName('english')] decades ago, those two locations have served as boroughs of the [ROOT.GetCountry.GetName] at the height of our country. While they are no longer the central hubs they once were, they both remain important places."
 daneflavor.15.a: "It was fated!"
 daneflavor.16.title: "[ShowLocationName('nottingham')] and [ShowLocationName('derby')] Reclaimed!"
 daneflavor.16.desc: "Lost to the [ShowCultureName('english')] decades ago, those two locations have served as boroughs of the [ROOT.GetCountry.GetName] at the height of our country. While they are no longer the central hubs they once were, they both remain important places."
 daneflavor.16.a: "It was fated!"

 vinflavor.1.title: "A Land of Hope"
 vinflavor.1.desc: "Vinland, with its breathtaking coasts and wild landscapes, embodies the spirit of adventure and resilience that defined the Viking age, echoing with the legends of explorers seeking new worlds.\nToday, the land is divided among several Norse factions, each battling the harsh realities of life and uncertain about what tomorrow may bring, their fates intertwined with the rugged wilderness and the enduring hope of discovering a brighter future amidst the turbulent currents of history."
 vinflavor.1.a: "What the future holds?"

 vinflavor.2.title: "The Matter of [ROOT.GetCountry.GetCapital.GetName]"
 vinflavor.2.desc: "[ROOT.GetCountry.GetCapital.GetName] has served as the capital of the Jarldom to this day, but over time it has become evident how the location of the capital is not well suited for the needs of the Country.\nMany ambitious members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] have presented us with some possible alternative locations for a new capital."
 vinflavor.2.a: "[ROOT.GetCountry.GetCapital.GetName] must remain as the capital of [ROOT.GetCountry.GetName]"
 vinflavor.2.b: "There is no better harbor than [ShowLocationName('akilasiewakik')] in the whole Isle"
 vinflavor.2.c: "We should relocate the capital to the city of our ancestors, [ShowLocationName('belle_isle')]!"
 vinflavor.2.d: "[ShowLocationName('uashat')] represents the future of [ROOT.GetCountry.GetName]!"

 vinflavor.3.title: "Reclaiming [GetCountry('P06').GetName]"
 vinflavor.3.desc: "The Hersirdom of [GetCountry('P06').GetName] has been part of the Jarldom of [ROOT.GetCountry.GetName] for decades, but unfortunately, due to the Great Famine, it break away years ago.\nThe moment has arrived for us to assert our rightful ownership."
 vinflavor.3.a: "Prepare your weapons"
 vinflavor.4.title: "[GetCountry('P06').GetName] Reclaimed!"
 vinflavor.4.desc: "This reunion not only restores the historical ties between the regions but also paves the way for economic growth, cultural revival, and strengthened unity within the realm, promising a brighter future for all inhabitants."
 vinflavor.4.a: "Long Live [ROOT.GetCountry.GetName]!"
 vinflavor.5.title: "A Centralized State"
 vinflavor.5.desc: "[ROOT.GetCountry.GetName] has ultimately forsaken its tribal traditions to embrace a regal monarchy, establishing a centralized and sovereign governance structure rooted in royal authority, marking a significant transformation from its ancestral customs to a unified, noble realm under a monarchical rule."
 vinflavor.5.a: "Long Live the King, Long Live [ROOT.GetCountry.GetName]!"
 vinflavor.6.title: "The Kingdom of [ROOT.GetCountry.GetName]"
 vinflavor.6.desc: "At long last, the diverse Vinlander tribes have been united under a single banner, culminating in the majestic birth of the Kingdom of [ROOT.GetCountry.GetName], a powerful new realm forged through strength, unity, and unwavering resolve, heralding an era of prosperity and sovereignty."
 vinflavor.6.a: "May [ROOT.GetCountry.GetName] Prosper Forever!"
 vinflavor.7.title: "The the High Kingdom of [ROOT.GetCountry.GetName]"
 vinflavor.7.desc: "At long last, all the Norse people have been united under one banner\nThis achievement not only empowers us as a central player in the world politics but also reinvigorates cultural and social connections among the norse people."
 vinflavor.7.a: "Long Live the High Kingdom of [ROOT.GetCountry.GetName]!"
 vinflavor.8.title: "Developing the Countryside"
 vinflavor.8.desc: "The assembly has determined that it would be prudent to allocate funds for the development of the rural areas within our nation. The decision to proceed with this initiative now rests with the [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 vinflavor.8.a: "Allocate the funds"
 vinflavor.8.b: "We cannot afford it now"
 vinflavor.9.title: "The Festival of [ROOT.GetCountry.GetCapital.GetName]"
 vinflavor.9.desc: "The streets burst into vibrant colors with blooming flowers and cheerful banners, as townsfolk and [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] alike don their most dazzling costumes to revel in lively feasts, playful jesters, and captivating stories. Markets overflow with beautiful crafts, fragrant spices, and delicious local treats, filling the air with joyful energy and a warm sense of community celebration."
 vinflavor.9.a: "Let's rejoice!"
 vinflavor.9.b: "Don't spare any expense!"
 vinflavor.10.title: "Developing the Interior"
 vinflavor.10.desc: "The assembly has concluded that it would be advantageous to allocate funds for the development of the interior within our nation. The final decision to proceed with this initiative now rests with the [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
 vinflavor.10.a: "Allocate the funds"
 vinflavor.10.b: "We cannot afford it now"


 touflavor.1.title: "The Duchy of [ROOT.GetCountry.GetName]"
 touflavor.1.desc: "The Duchy of [ROOT.GetCountry.GetName], renowned for its flourishing culture and rich history, has managed throughout the years to become the predominant authority in Southern [ShowRegionName('france_region')]. In this thriving society, [ShowReligionName('catharism')] has prospered and become the state religion, shaping the spiritual and social fabric of the duchy. The Cathar faith, with its emphasis on spiritual purity and dualistic beliefs, influences daily life, governance, and the arts, creating a unique atmosphere of religious devotion and intellectual exploration."
 touflavor.1.a: "What the future holds?"

 touflavor.2.title: "Wandering Troubadors"
 touflavor.2.desc: "The troubadours are medieval poet-musicians that originated in the 11th century in Occitania. They are renowned for their lyrical poetry, often focused on themes of chivalry, courtly love, and personal devotion, which they performed with music, typically accompanying themselves on instruments like the lute or vielle. As their presence has slowly faded in the last decades, we can make one last ditch attempt to revive their institution."
 touflavor.2.a: "So be it"
 touflavor.2.b: "We have no money to spare"

 touflavor.3.title: "The Matter of [GetCountry('AQN').GetName]"
 touflavor.3.desc: "The Duchy of [GetCountry('AQN').GetName] was incorporated into the Crown of [GetCountry('ENG').GetName] in 1153. As a Catholic territory under foreign influence, it is our duty to liberate this land and restore it as a Cathar nation."
 touflavor.3.a: "Prepare your weapons"
 touflavor.4.title: "Need to Reform"
 touflavor.4.desc: "Despite being surrounded by predominantly Catholic nations, the continued existence and prosperity of [ShowReligionName('catharism')] in the region is indeed remarkable. However, a miracle alone is insufficient to guarantee its long-term survival, and numerous peasants are now calling for reform to strengthen the faith's future."
 touflavor.4.a: "We must reform the faith"
 touflavor.4.b: "There's no need to antagonize the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]"
 touflavor.5.title: "The Kingdom of [ROOT.GetCountry.GetName]"
 touflavor.5.desc: "At long last, the kingdom of [ROOT.GetCountry.GetName] has been formed. with now an hegemon power controlling the region, the future of the region is ensured."
 touflavor.5.a: "Long Live the King, Long Live [ROOT.GetCountry.GetName]!"
 touflavor.6.title: "The Kingdom of [ROOT.GetCountry.GetName]"
 touflavor.6.desc: "The Kingdom of [ROOT.GetCountry.GetName] has finally been established, and with a hegemonic power now overseeing the region, the stability and future prospects of the area are secured."
 touflavor.6.a: "May [ROOT.GetCountry.GetName] Prosper Forever!"
 touflavor.7.title: "The #italic Canal Royal en Languedoc#!"
 touflavor.7.desc: "An intriguing infrastructural project has been presented to the Royal Court, involving the establishment of a channel connecting the capital, [ROOT.GetCountry.GetCapital.GetName], to [ShowLocationName('narbonne')], and subsequently linking [ShowLocationName('narbonne')] to [ShowLocationName('agde')]. Although quite expensive, it promises to significantly enhance our strategic control over the eastern region of the nation."
 touflavor.7.a: "Let's get to work then"
 touflavor.7.b: "It's too expensive"
 touflavor.8.title: "The #italic Talarn Pass#!"
 touflavor.8.desc: "An intriguing infrastructural project has been presented to the Royal Court, involving the establishment of a serie of tunnels connecting the capital, [ROOT.GetCountry.GetCapital.GetName], to [ShowLocationName('talarn')]. Although quite expensive, it promises to significantly enhance our strategic control over our aragonese possessions."
 touflavor.8.a: "Let's get to work then"
 touflavor.8.b: "It's too expensive"
 touflavor.9.title: "The Festival of [ROOT.GetCountry.GetCapital.GetName]"
 touflavor.9.desc: "The streets burst into vibrant colors with blooming flowers and cheerful banners, as townsfolk and [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] alike don their most dazzling costumes to revel in lively feasts, playful jesters, and captivating stories. Markets overflow with beautiful crafts, fragrant spices, and delicious local treats, filling the air with joyful energy and a warm sense of community celebration."
 touflavor.9.a: "Let's rejoice!"
 touflavor.9.b: "Don't spare any expense!"
 touflavor.10.title: "Cathar Refugees Leave [GetCountry('PRO').GetName]"
 touflavor.10.desc: "The refugees, carrying their belongings and desperate hope for safety, traverse treacherous paths through the Occitan countryside, seeking refuge within the city walls of [ShowLocationName('toulouse')]."
 touflavor.10.a: "Welcome them!"
 touflavor.11.title: "A Cry For Help"
 touflavor.11.desc: "The Kingdom of [GetCountry('MLL').GetName], although centered in [ShowProvinceDefinitionName('mallorca_province')], happens to own some lands bordering our country in which the majority of the population follows [ShowReligionName('catharism')].\nIn the recent years, the treatment towards the aformentioned population has gotten worse, and the bishop of [ShowLocationName('perpignan')] has sent us a cry for help to come and free those land from the [ShowReligionAdjective('catholic')] oppressor."
 touflavor.11.a: "We must answer the call!"
 touflavor.11.b: "We cannot afford a war right now."
 pruflavor.1.title: "The Birth of a Predestined Child"
 pruflavor.1.desc: "This newborn child, named [SCOPE.sCharacter('new_heir').GetName], son of [SCOPE.sCharacter('target_character').GetName] and heir to the throne of [ROOT.GetCountry.GetName], is blessed with an aura of destiny. As he will grow, it is said he will shape the course of the country, inspiring his people and forging a legacy that will resonate through generations as the greatest king of [ROOT.GetCountry.GetName]."
 pruflavor.1.a: "Could it be the start of a new 'Great' chapter in the history of [ROOT.GetCountry.GetName]?"
 pruflavor.1.historical_info: "Frederick the Great, King of Prussia from 1740 to 1786, was a prominent enlightened monarch who promoted religious tolerance, legal reform and education, embodying the ideals of Enlightenment while maintaining strong military prowess. His military genius was evident in his innovative tactics and strategic acumen, leading Prussia to numerous victories in battles such as the Battle of Liegnitz, in which he managed to force to a retreat an army of 100000 men with just 24000 men. His strategic and tactical brilliance allowed him to defeat armies twice his size five times in his military career, and his success established Prussia as a major European power."
 
 burflavor.1.title: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] Require Action"
 burflavor.1.desc: "[ROOT.GetCountry.GetName], once a fiery Kingdom, has been reduced to a mere duchy under the Crown of [GetCountry('FRA').GetName]. Because of the inept [overlord|e], [ROOT.GetCountry.GetName] now risks to be dragged into a useless conflict against [GetCountry('ENG').GetName], and the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] has already expressed its dissatisfaction with the situation, demanding that the Duke take action against [GetCountry('FRA').GetName]."
 burflavor.1.a: "Demand Independence!"
 burflavor.1.b: "Demand for greater autonomy from [GetCountry('FRA').GetName]"
 burflavortooltip.a.tt: "#N Some events will not trigger if [ROOT.GetCountry.GetName] is not independent"
 burflavor.2.title: "Reclaiming [ShowAreaName('burgundy_area')]"
 burflavor.2.desc: "With the attainment of independence, our nation is no longer compelled to endure the contentious power struggles imposed by the French nobility. Although [ROOT.GetCountry.GetGovernment.GetRuler.GetName] holds the title of Duke of [ShowAreaName('burgundy_area')], his de jure territories remain incomplete; consequently, any war against [SCOPE.sCountry('target_country').GetName] would be considered legally uncontested."
 burflavor.2.a: "To arms!"
 burflavor.2.b: "[SCOPE.sCountry('target_country').GetName] is not our enemy"
 burflavor.3.title: "Creating a Legacy for Ourselves"
 burflavor.3.desc: "[ROOT.GetCountry.GetName] faces an uncertain future, two paths are in front of us. The first path entails addressing our most immediate threat: [GetCountry('FRA').GetName], our former overlord. By neutralizing [GetCountry('FRA').GetName], [ROOT.GetCountry.GetName] could establish itself as the new hegemon of West Francia. The second path involves attempting to reclaim the kingdom of our ancestors, the Kingodom of Burgundy a title currently held by the Holy Roman Emperor. Since Barbarossa's reign, no emperor has demonstrated any interest towards such title; Should we choose to pursue such claim, it will be necessary to establish relations with the Emperor and seek admission into the [GetUniqueInternationalOrganization('hre').GetName]."
 burflavor.3.a: "Time to destroy [GetCountry('FRA').GetName]!"
 burflavor.3.b: "Contact the Holy Roman Emperor"
 burflavortooltip2.a.tt: "#N Further developments will happen once [ShowLocationName('paris')] has been taken"
 burflavor.4.title: "The Dissolution of [GetCountry('FRA').GetName]"
 burflavor.4.desc: "Burgundian troops march throguh the streets of [ShowLocationName('paris')], as the city has been finally liberated. In Notre-Dame de Paris, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] makes a proclamation: The French state has been dissolved, and new kingdom was born today: the Kingdom of [ROOT.GetCountry.GetName]!"
 burflavor.4.a: "Long live [ROOT.GetCountry.GetGovernment.GetRuler.GetName]!"
 burflavor.5.title: "[GetCountry('BUR').GetName] Seeks to Join the [GetUniqueInternationalOrganization('hre').GetName]"
 burflavor.5.desc: "The Duchy of [GetCountry('BUR').GetName] has recently declared its independence from [GetCountry('FRA').GetName] and is now seeking to join the [GetUniqueInternationalOrganization('hre').GetName]. While this move may appear to be motivated by a desire for protection, there exists a potential risk that [GetCountry('BUR').GetName] may be attempting to usurp the title of King of Burgundy, which, although presently unused, remains a privilege traditionally held by the Emperor."
 burflavor.5.a: "A new member of the Empire is always welcome"
 burflavor.5.b: "That title is ultimately insignificant, I might as well grant it to them as a act of friendship"
 burflavor.6.title: "The Response from the Emperor"
 burflavor.6.desc: "The Holy Roman Emperor has authorized our admission into the [GetUniqueInternationalOrganization('hre').GetName]; we must now devise a strategic plan to usurp his title and become King of Burgundy."
 burflavor.6.a: "Let's get to work"
 burflavor.7.title: "The Emperor Grants us the Kingship"
 burflavor.7.desc: "In an act of extraordinary generosity and friendship, the Emperor has not only permitted us to enter the [GetUniqueInternationalOrganization('hre').GetName], but has also bestowed upon us a kingdom title for which we had no prior claim, the Kingdom of Burgundy.\nLong Live the Emperor!"
 burflavor.7.a: "And long live the new king, [ROOT.GetCountry.GetGovernment.GetRuler.GetName]!"
 burflavortooltip3.a.tt: "#N Further developments will happen once [ShowLocationName('arles')] has been taken"
 burflavor.8.title: "Usurping a Title"
 burflavor.8.desc: "The Archbishop of [ROOT.GetCountry.GetCapital.GetName] has conveyed significant news: although the title of King of Burgundy is traditionally held by the Holy Roman Emperor, its full authority is contingent upon the Emperor's coronation in [ShowLocationName('arles')]. Currently, the title remains vacant, and by seizing [ShowLocationName('arles')], we can restore the title of King of Burgundy and establish ourselves as the de facto sovereign of Burgundy."
 burflavor.8.a: "We have a plan then"
 burflavor.9.title: "The New King of [ROOT.GetCountry.GetName]"
 burflavor.9.desc: "In accordance with established tradition, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been crowned as the King of [ROOT.GetCountry.GetName] at the Cathedral of [ShowLocationName('arles')]. Although the legality of this act remains subject to debate, no objections have been raised to contest it, thereby resulting in the official restoration of the Kingdom of [ROOT.GetCountry.GetName]."
 burflavor.9.a: "Long Live [ROOT.GetCountry.GetName]!"

 liqflavor.1.title: "Heirs of Rome"
 liqflavor.1.desc: "The Republic of [ROOT.GetCountry.GetName] was established by the descendants of Roman legionaries who were taken prisoner during the Battle of Carrhae. The inhabitants of Liqian are the descendants of these Roman prisoners, who were resettled by the victorious Parthians along their eastern frontier. Over the centuries, the Republic served under various overlords, a circumstance that contributed to the endurance of both their community and the institution of the Republic into our times."
 liqflavor.1.a: "For the Glory of Rome!"
 liqflavor.2.title: "Carpe Diem"
 liqflavor.2.desc: "In light of the [ShowSituationName('red_turban_rebellions')] and the subsequent imminent collapse of [GetCountry('CHI').GetName], numerous members of the Senate are urging the consul to take decisive action and initiate military engagement against [GetCountry('CHI').GetName] without delay, in order to prevent its recovery."
 liqflavor.2.a: "Audentes Fortuna Iuvat!"
 liqflavor.2.b: "We shall not meddle in [GetCountry('CHI').GetName]'s affairs"


 moraflavor.1.title: "Glory of the Past"
 moraflavor.1.desc: "The Duchy of [ROOT.GetCountry.GetName] is the successor state to what was once the Kingdom of Great Moravia, the first successful endeavor to unify the majority of West Slavic people under one banner.\nUnfortunately, more than four centuries have passed since its fall, and significant changes have occurred over the intervening period.\nThe country's survival has been facilitated by the widespread conversion to Catholicism and strategic alliances formed during its history.\nNonetheless, the future of [ROOT.GetCountry.GetName] remains uncertain."
 moraflavor.1.a: "What holds the Future?"

 moraflavor.2.title: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] Demand Action"
 moraflavor.2.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] are petitioning [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to grant new coinage rights in their favor, with the objective of minting a new Groschen. This initiative aims to enable our country to detach from the Bohemian Groschen and any regional unofficial currency, and enhance its monetary independence."
 moraflavor.2.a: "Grant them such privilege"
 moraflavor.2.b: "Privileges have to be earned!"

 moraflavor.3.title: "Lost Lands"
 moraflavor.3.desc: "[ShowLocationName('krnov')], [ShowLocationName('fryvaldov')] and [ShowLocationName('ziebice')] historically served as the economic core of Great Moravia, providing the kingdom with a consistent supply of [ShowGoodsName('silver')] and [ShowGoodsName('goods_gold')]. However, these territories have long been incorporated into [GetCountry('WRC').GetName]. Although our legal claim to these lands may be somewhat tenuous, we may be able to persuade neighboring nations of the validity of our claim through "diplomatic" means."
 moraflavor.3.a: "The time has come to retake our lost lands"
 moraflavor.3.b: "Engaging in bribery is not an acceptable conduct for a monarch."
 moraflavor.4.title: "A Southern Capital?"
 moraflavor.4.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] of [ShowLocationName('krupina')] are formally requesting that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] grant the town of [ShowLocationName('krupina')] official City rights. They have also expressed their willingness to contribute partially towards the compensation to be provided to the Count of [ShowProvinceDefinitionName('hont_province')]. Investing in [ShowLocationName('krupina')] will enable us to enhance the state's control over this resource-rich region, thereby ensuring greater strategic and economic stability."
 moraflavor.4.a: "Let's invest in [ShowLocationName('krupina')]!"
 moraflavor.4.b: "We cannot afford that."
 moraflavor.4.c: "Those funds will better used in the hands of the state."
 moraflavor.5.title: "The Southern Capital"
 moraflavor.5.desc: "Following [ShowLocationName('krupina')]'s elevation to the status of the central hub within the southern region of [ROOT.GetCountry.GetName], the local [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have amassed nearly sufficient funds to establish a direct roadway connecting the capital to the city. Nonetheless, they seek a modest contribution from the government to facilitate the commencement of this infrastructural project."
 moraflavor.5.a: "Grant them funds."
 moraflavor.5.b: "We cannot afford that."
 moraflavor.5.c: "Those funds will better used in the hands of the state."
 moraflavor.6.title: "The Kingdom of [ROOT.GetCountry.GetName]"
 moraflavor.6.desc: "After more than four centuries, [ROOT.GetCountry.GetName] has been refounded. [ShowCultureName('moravian')], [ShowCultureName('czech')], [ShowCultureName('slovak')] and [ShowCultureName('silesian')] people have all accepted to unite under one name and one banner, and thus [ROOT.GetCountry.GetName] has been established.\nIt has now started a new age of prosperity for all moravian people, and may it never fall again."
 moraflavor.6.a: "Long live [ROOT.GetCountry.GetName]!"
 moraflavor.7.title: "The Empire of [ROOT.GetCountry.GetName]"
 moraflavor.7.desc: "[ROOT.GetCountry.GetName] has emerged as a rising Empire in [ShowRegionName('carpathia_region')]. A new day dawns, and a new nation rises to the world stage. [ROOT.GetCountry.GetAdjective] glory is the inevitable future."
 moraflavor.7.a: "Long Live [ROOT.GetCountry.GetGovernment.GetRuler.GetName]!"
 moraflavor.8.title: "The Empire of [ROOT.GetCountry.GetName]"
 moraflavor.8.desc: "Thanks to the heroic deeds of our great ruler, a new Empire was born.\nToday in [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been crowned Emperor of the Danube in front of a crowd of fifty thousand people, and diplomats from all across europe are coming to the capital to personally congratulate the Emperor for his grand feat."
 moraflavor.8.a: "Long Live [ROOT.GetCountry.GetGovernment.GetRuler.GetName]!"
 moraflavor.9.title: "Uncontrolled Inflation"
 moraflavor.9.desc: "Inflation is rampaging in [ROOT.GetCountry.GetName], leading to growing unrest among the populace. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] is now demanding that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] grant them a monopoly over the coinage in order to rectify the economic turmoil caused by the [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 moraflavor.9.a: "So be it"
 moraflavor.9.b: "Over my dead body!"
 moraflavor.10.title: "[ShowProvinceDefinitionName('opavsko_province')] Reclaimed!"
 moraflavor.10.desc: "[ShowLocationName('krnov')] and [ShowLocationName('fryvaldov')], once the economic core of Great Moravia, have been reclaimed. Reintegrating those lands into our economy will guarantee us a constant influx of [ShowGoodsName('silver')] and [ShowGoodsName('goods_gold')], bringing prosperity to [ROOT.GetCountry.GetName] once again."
 moraflavor.10.a: "Let's Rejoice!"
 moraflavor.11.title: "The Birth of [ROOT.GetCountry.GetName]"
 moraflavor.11.desc: "The unification of the Polish, Czech, Moravian and Slovak peoples under the banner of [ROOT.GetCountry.GetName] marks a historic moment of solidarity and cultural kinship among the West Slavic People. As citizens from diverse backgrounds come together to celebrate this new state, streets are filled with joyous parades, music, and traditional dances, showcasing their rich heritage and shared history. This celebration not only honors their collective identity but also symbolizes hope for collaboration, mutual support, and a bright future together as they embark on the journey of nation-building and governance in [ROOT.GetCountry.GetName]."
 moraflavor.11.a: "Long Live [ROOT.GetCountry.GetName]!"
 moraflavor.12.title: "The Breadbasket of [ROOT.GetCountry.GetName]"
 moraflavor.12.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] has recognized the potential of the location of [ShowLocationName('raciborz')] to become the primary breadbasket of our nation and has approached [ROOT.GetCountry.GetGovernment.GetRuler.GetName] with a compelling proposal. They are willing to bear the majority of the expenses associated with its development in exchange for a few concessions.."
 moraflavor.12.a: "Accept the proposal"
 moraflavor.12.b: "[ShowLocationName('kozle')] is a far better suited location for such investment"
 moraflavor.12.c: "No concessions will be granted today!"
 moraflavor.12.d: "Seize the money and run away"

 sileflavor.1.title: "The Duchy of [ROOT.GetCountry.GetName]"
 sileflavor.1.desc: "The Duchy of [ROOT.GetCountry.GetName] has established itself as a dominant regional power in Silesia through strategic political marriages with the [ShowDynastyName('piast_dynasty')] dynasty and pragmatic political policies. These efforts have enabled the duchy to ultimately defeat [GetCountry('BOH').GetName], annex the provinces of [ShowProvinceDefinitionName('hradecko_province')] and [ShowProvinceDefinitionName('boleslavsko_province')], and emerge as a rising new power in the region."
 sileflavor.1.a: "For the Glory of [ROOT.GetCountry.GetName]!"

 sileflavor.2.title: "Uncontrolled Inflation"
 sileflavor.2.desc: "Inflation is rampaging in [ROOT.GetCountry.GetName], leading to growing unrest among the populace. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] is now demanding that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] grant them a monopoly over the coinage in order to rectify the economic turmoil caused by the [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 sileflavor.2.a: "So be it"
 sileflavor.2.b: "Over my dead body!"

 sileflavor.3.title: "The Matter of [ShowAreaName('silesia_area')]"
 sileflavor.3.desc: "[ROOT.GetCountry.GetName] has successfully established itself as the dominant power in [ShowAreaName('silesia_area')]; however, the region continues to be contested by other nations. Fortunately, for a suitable remuneration, we can persuade the Bishop of [ROOT.GetCountry.GetCapital.GetName] to fabricate a claim over the remaining provinces of [ShowAreaName('silesia_area')]."
 sileflavor.3.a: "Let's proceed, shall we?"
 sileflavor.3.b: "Engaging in bribery is not an acceptable conduct for a monarch."
 sileflavortooltip.a.tt: "#N Further events will trigger once a direct connection between the town and the capital has been established, and the town's population has reached a minimum of 15,000 inhabitants"
 sileflavor.4.title: "The Mining Town of [ShowLocationName('nysa')]"
 sileflavor.4.desc: "The southern region of [ROOT.GetCountry.GetName], renowned for its mineral-rich provinces, holds significant economic importance for the country. The local [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] has formally requested that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] allocate resources towards the development of this region, beginning with the establishment of a mining town in [ShowLocationName('nysa')] to facilitate future growth and prosperity."
 sileflavor.4.a: "Grant the funds"
 sileflavor.4.b: "We cannot afford that"
 sileflavor.5.title: "Commotion at the Parliament"
 sileflavor.5.desc: "A debate has been ongoing within the parliament regarding the future development of the capital. A faction of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] is advocating for the expansion of [ROOT.GetCountry.GetCapital.GetName], while the remaining members are divided between those who favor relocating the capital to more advantageous locations, such as [ShowLocationName('opole')] or [ShowLocationName('nysa')], the mining town. Additionally, proponents of relocating to [ShowLocationName('nysa')] have expressed their willingness to personally invest funds to support the development of the town."
 sileflavor.5.a: "Expand the current capital"
 sileflavor.5.b: "Relocate the capital to [ShowLocationName('opole')]"
 sileflavor.5.c: "Relocate the capital to the mining town, [ShowLocationName('nysa')]"
 sileflavor.5.d: "Keep the status quo"
 sileflavor.6.title: "The Unification of [ROOT.GetCountry.GetName]"
 sileflavor.6.desc: "Finally, the region of [ShowAreaName('silesia_area')] has been successfully unified under a single banner, marking a significant milestone in its historical and political development. This unification represents a momentous achievement, consolidating the territory and fostering a sense of cohesion and identity among its inhabitants."
 sileflavor.6.a: "Long live [ROOT.GetCountry.GetName]!"
 sileflavor.7.title: "The Birth of [ROOT.GetCountry.GetName]"
 sileflavor.7.desc: "The unification of the Polish, Czech, Moravian and Slovak peoples under the banner of [ROOT.GetCountry.GetName] marks a historic moment of solidarity and cultural kinship among the West Slavic People. As citizens from diverse backgrounds come together to celebrate this new state, streets are filled with joyous parades, music, and traditional dances, showcasing their rich heritage and shared history. This celebration not only honors their collective identity but also symbolizes hope for collaboration, mutual support, and a bright future together as they embark on the journey of nation-building and governance in [ROOT.GetCountry.GetName]."
 sileflavor.7.a: "Long Live [ROOT.GetCountry.GetName]!"
 sileflavor.8.title: "The Empire of [ROOT.GetCountry.GetName]"
 sileflavor.8.desc: "Thanks to the heroic deeds of our great ruler, a new Empire was born.\nToday in [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been crowned Emperor of the Danube in front of a crowd of fifty thousand people, and diplomats from all across europe are coming to the capital to personally congratulate the Emperor for his grand feat."
 sileflavor.8.a: "Long Live [ROOT.GetCountry.GetGovernment.GetRuler.GetName]!"
 sileflavor.9.title: "Turmoil in [ShowLocationName('nysa')]"
 sileflavor.9.desc: "The opposition to the proposed relocation of the capital to the town of [ShowLocationName('nysa')] has incited significant discontent among the local [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] who have already invested considerably in the mining town. In their agitation, these [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] have submitted a petition to the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] advocating for the establishment of a governorship in [ShowLocationName('nysa')]. Additionally, they have expressed their willingness to partially bear the financial burden associated with the development of necessary infrastructure."
 sileflavor.9.a: "So be it"
 sileflavor.9.b: "We currently cannot afford it"
 sileflavor.10.title: "A Preventive War?"
 sileflavor.10.desc: "As the truce with [GetCountry('BOH').GetName] approaches its conclusion, numerous members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] anticipate that [GetCountry('BOH').GetName] will initiate military actions to reclaim the provinces of[ShowProvinceDefinitionName('hradecko_province')] and [ShowProvinceDefinitionName('boleslavsko_province')]. In response, a prominent faction favoring conflict has emerged within the political landscape, strongly advocating for a preventive war against [GetCountry('BOH').GetName]."
 sileflavor.10.a: "To war, we go!"
 sileflavor.10.b: "We must not further antagonize [GetCountry('BOH').GetName]"
 sileflavor.12.title: "The Breadbasket of [ROOT.GetCountry.GetName]"
 sileflavor.12.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] has recognized the potential of the location of [ShowLocationName('raciborz')] to become the primary breadbasket of our nation and has approached [ROOT.GetCountry.GetGovernment.GetRuler.GetName] with a compelling proposal. They are willing to bear the majority of the expenses associated with its development in exchange for a few concessions.."
 sileflavor.12.a: "Accept the proposal"
 sileflavor.12.b: "[ShowLocationName('kozle')] is a far better suited location for such investment"
 sileflavor.12.c: "No concessions will be granted today!"
 sileflavor.12.d: "Seize the money and run away"
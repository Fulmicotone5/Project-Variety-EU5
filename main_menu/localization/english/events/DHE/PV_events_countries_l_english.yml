 daneflavor.8.title: "A New Capital?"
 daneflavor.8.desc: "Numerous members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] have articulated their aspiration for the [ROOT.GetCountry.GetName] to establish hegemonic dominance over the North Sea, while also noting that [ShowLocationName('london')] would geographically serve as a more advantageous location to advance such ambitions."
 daneflavor.8.a: "[ROOT.GetCountry.GetCapital.GetName] shall remain the capital!"
 daneflavor.8.b: "Why not [ShowLocationName('boston')]?"
 daneflavor.8.c: "And so [ShowLocationName('london')] shall become the new capital!"
ach_mission_events.5.b.tt: "Gain military modernization, discipline, and army tradition"

ach_mission_events.6.a.tt: "Gain imperial coronation, prestige, legitimacy, and stability"
ach_mission_events.6.b.tt: "Gain Latin Empire established, government reforms, and prestige"

ach_mission_events.7.a.tt: "Gain crusader state, prestige, and CB against the infidel"

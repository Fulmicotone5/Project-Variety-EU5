# ==================== ACHAEA MISSION PACK HEADER ====================
achaea_missions: "The Latin Empire"
achaea_missions_desc: "Guide the Principality of Achaea or Athens from a crusader outpost to the heart of a renewed Latin Empire, uniting the Greek lands under Frankish rule."
achaea_missions_BUTTON_TOOLTIP: "Complete missions to strengthen Achaea, secure independence, and forge a new Latin Empire in the East."
achaea_missions_CRITERIA_DESCRIPTION: "Consolidate the Peloponnese, expand into Greece, and claim the legacy of Rome to unlock the full potential of the Latin Empire."
achaea_missions_BUTTON_DETAILS: "Complete missions to strengthen Achaea, secure independence, and forge a new Latin Empire in the East."
achaea_missions_CRITERIA_DESC: "Consolidate the Peloponnese, expand into Greece, and claim the legacy of Rome to unlock the full potential of the Latin Empire."

# ==================== INDEPENDENCE & INTERNAL POLITICS MISSIONS ====================
mission_ach_strengthen_the_duchy: "Strengthen the Duchy"
mission_ach_strengthen_the_duchy_desc: "Establish firm ducal authority over the fractious nobility of Achaea, laying the foundation for a strong and independent state."

mission_ach_secure_the_baronies: "Secure the Baronies"
mission_ach_secure_the_baronies_desc: "Bring the unruly barons of Achaea to heel, centralizing power and ensuring their loyalty to the ducal crown."

mission_ach_shadow_of_naples: "The Shadow of Naples"
mission_ach_shadow_of_naples_desc: "Our nominal Angevin overlords watch us from across the Adriatic. We must navigate their influence carefully, gathering strength until we can break free."

mission_ach_assert_independence: "Assert Independence"
mission_ach_assert_independence_desc: "Cast off the overlord yoke and proclaim ourselves an independent realm, answerable to no foreign prince."

mission_ach_establish_parliament: "Establish Parliament"
mission_ach_establish_parliament_desc: "Create a governing council that represents the estates of the realm, giving voice to nobles, burghers, and clergy in the governance of Achaea."

mission_ach_reform_feudal_contracts: "Reform Feudal Contract"
mission_ach_reform_feudal_contracts_desc: "Modernize the ancient feudal obligations that bind our realm, creating a more efficient and just system of governance."

mission_ach_deal_with_the_anjevins: "Deal with the Anjevins"
mission_ach_deal_with_the_anjevins_desc: "Secure a lasting peace with our former Angevin overlords, transforming them from enemies into grudging allies."

# ==================== ECONOMIC DEVELOPMENT MISSIONS ====================
mission_ach_develop_the_morea: "Develop Morea"
mission_ach_develop_the_morea_desc: "Invest in the fertile lands of the Peloponnese, transforming the Morea into the breadbasket of our growing realm."

mission_ach_cultivate_greek_wine: "Cultivate Greek Wine"
mission_ach_cultivate_greek_wine_desc: "The slopes of the Peloponnese are ideal for viticulture. Develop our wine production to rival the finest vintages of Europe."

mission_ach_olive_groves_of_the_peloponnese: "Olive Groves of the Peloponnese"
mission_ach_olive_groves_of_the_peloponnese_desc: "Expand our olive production, producing the finest olive oil in the Mediterranean to feed our people and enrich our merchants."

mission_ach_silk_of_the_morea: "Silk of the Morea"
mission_ach_silk_of_the_morea_desc: "Establish silk production in the Morea, bringing the prized fabric of the East to our workshops and markets."

mission_ach_establish_trade_routes: "Establish Trade Routes"
mission_ach_establish_trade_routes_desc: "Connect our markets to the great trading networks of the Mediterranean, bringing the wealth of the world to Achaea."

mission_ach_patras_emporium: "Patras Emporium"
mission_ach_patras_emporium_desc: "Transform Patras into a great emporium, a trading hub where merchants from East and West meet to exchange goods."

mission_ach_dominate_corinthian_gulf_trade: "Dominate Corinthian Gulf Trade"
mission_ach_dominate_corinthian_gulf_trade_desc: "Establish dominance over the trade routes of the Corinthian Gulf, controlling the commerce between the Ionian and Aegean seas."

mission_ach_achaean_merchant_marine: "Achaean Merchant Marine"
mission_ach_achaean_merchant_marine_desc: "Build a powerful merchant marine to carry our goods across the seas and bring the wealth of distant ports to our shores."

# ==================== NAVAL DEVELOPMENT MISSIONS ====================
mission_ach_build_a_navy: "Build a Navy"
mission_ach_build_a_navy_desc: "Construct a fleet of warships to protect our coasts and safeguard our growing maritime interests."

mission_ach_expand_the_galley_fleet: "Expand the Galley Fleet"
mission_ach_expand_the_galley_fleet_desc: "Greatly expand our fleet of galleys, the warships that rule the Mediterranean, to ensure our naval supremacy."

mission_ach_control_the_ionian_sea: "Control the Ionian Sea"
mission_ach_control_the_ionian_sea_desc: "Secure dominance over the Ionian Sea, protecting our western approaches and projecting power into the Adriatic."

mission_ach_secure_the_aegean_sea: "Secure the Aegean Sea"
mission_ach_secure_the_aegean_sea_desc: "Establish naval supremacy in the Aegean, controlling the ancient sea routes that connect Greece to Asia and the East."

mission_ach_crete_and_cyprus: "Crete and Cyprus"
mission_ach_crete_and_cyprus_desc: "Secure the great islands of Crete and Cyprus, strategic outposts that guard the trade routes to the Levant and Egypt."

mission_ach_establish_maritime_trade: "Establish Maritime Trade"
mission_ach_establish_maritime_trade_desc: "Build a vast maritime trade network spanning the Mediterranean, enriching our empire and connecting the ports of the world."

# ==================== MILITARY EXPANSION MISSIONS ====================
mission_ach_prepare_for_expansion: "Prepare for Expansion"
mission_ach_prepare_for_expansion_desc: "Drill our armies and stockpile provisions for the great campaigns of reconquest that await us."

mission_ach_unify_the_morea: "Unify the Morea"
mission_ach_unify_the_morea_desc: "Unite all the lands of the Peloponnese under the Achaean banner, bringing every village and fortress under our rule."

mission_ach_conquer_attica: "Unify Attica"
mission_ach_conquer_attica_desc: "Seize the ancient land of Attica, home to the great city of Athens, and bring it under our dominion."

mission_ach_claim_the_greek_islands: "Claim the Greek Islands"
mission_ach_claim_the_greek_islands_desc: "Bring the Aegean islands under our rule, securing the stepping stones to the East."

mission_ach_epirus_campaign: "Epirus Campaign"
mission_ach_epirus_campaign_desc: "Conquer the rugged lands of Epirus, extending our control over the western shores of Greece."

mission_ach_albanian_marches: "Albanian Marches"
mission_ach_albanian_marches_desc: "Secure the Albanian marches, extending our influence along the Adriatic coast and guarding the approaches to our heartland."

mission_ach_conquer_thessaly: "Conquer Thessaly"
mission_ach_conquer_thessaly_desc: "Bring the fertile plains of Thessaly under our rule, the granary of northern Greece."

mission_ach_conquer_macedonia: "Conquer Macedonia"
mission_ach_conquer_macedonia_desc: "Claim the ancient land of Macedonia, home of Philip and Alexander, and secure its proud cities for our empire."

mission_ach_conquer_thrace: "Conquer Thrace"
mission_ach_conquer_thrace_desc: "Push into Thrace, the gateway to Constantinople, and bring its strategic lands under our control."

mission_ach_capture_constantinople: "Capture Constantinople"
mission_ach_capture_constantinople_desc: "Seize the great city of Constantinople, the Jewel of the East, and make it the capital of our new Latin Empire."

# ==================== RELIGIOUS & CULTURAL MISSIONS ====================
mission_ach_catholic_mission: "Catholic Mission"
mission_ach_catholic_mission_desc: "Strengthen the Catholic faith in our Greek lands, building churches and monasteries to spread the true faith."

mission_ach_latin_patronage: "Latin Patronage"
mission_ach_latin_patronage_desc: "Secure the patronage of the Holy See, earning the Pope's blessing for our endeavors in the East."

mission_ach_convert_the_orthodox: "Convert the Orthodox"
mission_ach_convert_the_orthodox_desc: "Bring the Orthodox Greeks into the Catholic fold, uniting the faithful under the authority of Rome."

mission_ach_promote_latin_culture: "Promote Latin Culture"
mission_ach_promote_latin_culture_desc: "Promote Latin culture, language, and customs among our Greek subjects, creating a distinctive Franco-Greek civilization."

mission_ach_frankish_greek_fusion: "Frankish-Greek Fusion"
mission_ach_frankish_greek_fusion_desc: "Forge a new culture that blends the best of Frankish and Greek traditions, creating a people worthy of a great empire."

mission_ach_establish_latin_patriarchate: "Establish Latin Patriarchate"
mission_ach_establish_latin_patriarchate_desc: "Establish a Latin Patriarch in Constantinople, restoring the union of East and West under the authority of Rome."

# ==================== MILITARY MODERNIZATION MISSIONS ====================
mission_ach_restore_the_theme_system: "Restore the Theme System"
mission_ach_restore_the_theme_system_desc: "Revive the Roman theme system, creating a military infrastructure that can mobilize the full strength of our Greek lands."

mission_ach_fortify_the_hexamilion: "Fortify the Hexamilion"
mission_ach_fortify_the_hexamilion_desc: "Restore and strengthen the Hexamilion Wall across the Isthmus of Corinth, the greatest fortification in Greece."

mission_ach_modernize_the_army: "Modernize the Army"
mission_ach_modernize_the_army_desc: "Reform our military on modern lines, equipping our forces with the latest weapons and tactics."

mission_ach_black_powder_politics: "Black Powder Politics"
mission_ach_black_powder_politics_desc: "Embrace the new technology of gunpowder, building cannon foundries and training our gunners to master the art of siege warfare."

# ==================== FORMATION OF THE LATIN EMPIRE MISSIONS ====================
mission_ach_claim_the_legacy_of_rome: "Claim the Legacy of Rome"
mission_ach_claim_the_legacy_of_rome_desc: "Break with the Papacy and the Holy Roman Emperor, and claim the legacy of Rome"

mission_ach_reclaim_anatolia: "Reclaim Anatolia"
mission_ach_reclaim_anatolia_desc: "Drive the Turks from Anatolia, restoring Christian rule to the heartland of the old Roman Empire."

mission_ach_subdue_the_turkish_beys: "Subdue the Turkish Beys"
mission_ach_subdue_the_turkish_beys_desc: "Bring the Turkish beyliks of Anatolia under our authority, securing the Asian provinces of our new empire."

mission_ach_prepare_for_imperial_coronation: "Prepare for Imperial Coronation"
mission_ach_prepare_for_imperial_coronation_desc: "Prepare the grand ceremony that will crown us Emperor of the Latins, the rightful successor to the Roman throne."

# ==================== LATIN EMPIRE POST-FORMATION MISSIONS ====================
mission_lat_form_the_latin_empire: "Form the Latin Empire"
mission_lat_form_the_latin_empire_desc: "Proclaim the restoration of the Latin Empire, claiming the ancient throne of Constantinople for our dynasty."

mission_lat_imperial_authority: "Imperial Authority"
mission_lat_imperial_authority_desc: "Establish the full authority of the new Latin Emperor over the fractious nobility and diverse peoples of our empire."

mission_lat_imperial_bureaucracy: "Imperial Bureaucracy"
mission_lat_imperial_bureaucracy_desc: "Build a professional bureaucracy to govern our far-flung empire, creating the institutions of a great power."

mission_lat_restore_the_senate: "Restore the Senate"
mission_lat_restore_the_senate_desc: "Revive the ancient Roman Senate as a council of state, giving the great men of the empire a voice in its governance."

mission_lat_crusade_for_the_holy_land: "Crusade for the Holy Land"
mission_lat_crusade_for_the_holy_land_desc: "Launch a great crusade to liberate the Holy Land, leading the forces of Christendom against the infidel."

mission_lat_capture_jerusalem: "Capture Jerusalem"
mission_lat_capture_jerusalem_desc: "Seize the holy city of Jerusalem, restoring Christian rule to the birthplace of our faith."

mission_lat_convert_the_levant: "Convert the Levant"
mission_lat_convert_the_levant_desc: "Spread the Catholic faith throughout the Levant, converting the peoples of the Holy Land to the true faith."

mission_lat_convert_the_orthodox_empire: "Convert the Orthodox Empire"
mission_lat_convert_the_orthodox_empire_desc: "Bring the Orthodox peoples of our empire into the Catholic fold, fulfilling the dream of church union."

mission_lat_unite_catholic_greece: "Unite Catholic Greece"
mission_lat_unite_catholic_greece_desc: "Unite all of Greece under the Catholic faith, creating a unified Christian realm in the Eastern Mediterranean."

mission_lat_imperial_army_reforms: "Imperial Army Reforms"
mission_lat_imperial_army_reforms_desc: "Reform our army on the model of the ancient Roman legions, creating a disciplined and professional force."

mission_lat_imperial_navy_reforms: "Navy Reforms"
mission_lat_imperial_navy_reforms_desc: "Expand and modernize our navy, creating a fleet worthy of a great Mediterranean power."

mission_lat_trade_hegemony: "Trade Hegemony"
mission_lat_trade_hegemony_desc: "Establish our empire as the dominant commercial power in the Mediterranean, controlling the great trade routes of the East."

mission_lat_unite_the_crusader_kingdoms: "Unite the Crusader Kingdoms"
mission_lat_unite_the_crusader_kingdoms_desc: "Unite all the Crusader states under our imperial banner, creating a great Christian dominion in the East."

mission_lat_dominate_the_mediterranean: "Dominate the Mediterranean"
mission_lat_dominate_the_mediterranean_desc: "Establish our naval dominance over the entire Mediterranean, making our empire the undisputed master of the sea."

mission_lat_reconquer_roman_empire: "Reconquer the Roman Empire"
mission_lat_reconquer_roman_empire_desc: "Fulfill the ultimate ambition: restore the Roman Empire in its fullness, uniting the Mediterranean world under our rule."

mission_ach_establish_the_academy: "Establish the Ducal Academy"
mission_ach_establish_the_academy_desc: "Create a great center of learning in our capital, attracting scholars and thinkers from across the known world."

mission_ach_prince_of_achaea: "Prince of Greece"
mission_ach_prince_of_achaea_desc: "Establish our realm as a true principality, a power that commands the respect of kings and empires."

mission_lat_imperial_coronation_ceremony: "Imperial Coronation Ceremony"
mission_lat_imperial_coronation_ceremony_desc: "Perform the grand ceremony of imperial coronation in the great church of Hagia Sophia, establishing our dynasty as the rightful Emperors of the Romans."

# ==================== EVENT LOCALIZATION ====================

# === EVENT: INDEPENDENCE ACHIEVED ===
ach_mission_events.1.t: "The Duchy Secured"
ach_mission_events.1.d: "The Principality of Achaea stands secure under our rule. The barons have been brought to heel, the treasury is full, and our people look to us for leadership. The foundation of a great state has been laid in the heart of Greece."
ach_mission_events.1.a: "The future of Greece is Latin"
ach_mission_events.1.b: "Now we look to expand"

# === EVENT: INDEPENDENCE FROM NAPLES ===
ach_mission_events.2.t: "The Angevin Yoke Broken"
ach_mission_events.2.d: "After years of careful diplomacy and military preparation, we have cast off the shadow of Naples. Our independence is recognized, and we stand as a free realm, answerable to no foreign prince. The French lords of Greece have found a champion."
ach_mission_events.2.a: "A new power rises in Greece"
ach_mission_events.2.b: "The Latin legacy continues"

# === EVENT: CONQUEST OF CONSTANTINOPLE ===
ach_mission_events.3.t: "The Queen of all Cities"
ach_mission_events.3.d: "Constantinople has fallen! The great city, pride of the Eastern Empire, now flies the banner of our triumphant armies. The wealth of ages fills our treasury, and the prestige of this victory echoes across Christendom. We have done what the Crusaders of old did, and we have done it for ourselves."
ach_mission_events.3.a: "A new Rome rises"
ach_mission_events.3.b: "The Empire is restored"

# === EVENT: LATIN PATRIARCHATE ESTABLISHED ===
ach_mission_events.4.t: "The Latin Patriarch"
ach_mission_events.4.d: "With the blessing of His Holiness the Pope, we have established a Latin Patriarch in Constantinople. The schism between East and West begins to heal as our priests work to bring the Orthodox faithful into the true Church. Rome looks upon our realm with favor."
ach_mission_events.4.a: "The Church is united"
ach_mission_events.4.b: "The Emperor's faith"

# === EVENT: THEME SYSTEM RESTORED ===
ach_mission_events.5.t: "The Return of the Themes"
ach_mission_events.5.d: "The ancient Roman theme system has been restored in our Greek lands. Our subjects now provide soldiers and taxes as their ancestors did, creating a military infrastructure that can sustain our empire. The legacy of Rome lives on in our new Greek army."
ach_mission_events.5.a: "The Romans of the East"
ach_mission_events.5.b: "A more Latin system"

# === EVENT: IMPERIAL CORONATION ===
ach_mission_events.6.t: "The Imperial Crown"
ach_mission_events.6.d: "In the great church of Hagia Sophia, we have been crowned Emperor of the Latins. The Pope himself has blessed our reign, and the nobles of our realm have sworn their fealty. We are no longer merely princes of Achaea; we are the Emperors of the East, heirs to the legacy of Rome."
ach_mission_events.6.a: "Imperator Romanorum"
ach_mission_events.6.b: "The Empire stands eternal"

# === EVENT: CRUSADE FOR THE HOLY LAND ===
ach_mission_events.7.t: "The Crusade Begins"
ach_mission_events.7.d: "At our call, the warriors of Christendom have gathered. The great crusade to liberate the Holy Land has begun, with our empire leading the armies of the faithful against the infidel. The Pope blesses our enterprise, and the whole of Europe watches."
ach_mission_events.7.a: "God wills it"
ach_mission_events.7.b: "For the glory of God"

# === EVENT: JERUSALEM RESTORED ===
ach_mission_events.8.t: "Jerusalem Restored"
ach_mission_events.8.d: "The holy city of Jerusalem has fallen to our armies. The Church of the Holy Sepulchre is once again in Christian hands, and pilgrims may worship at the sites of our Lord's passion without fear. This is the greatest achievement of our reign, a triumph that will echo through the ages."
ach_mission_events.8.a: "Deus Vult"
ach_mission_events.8.b: "The Holy Land is free"

# === EVENT: MEDITERRANEAN DOMINANCE ===
ach_mission_events.9.t: "The Mare Nostrum"
ach_mission_events.9.d: "Our fleets rule the Mediterranean. From the Straits of Gibraltar to the shores of the Levant, our ships control the sea lanes and protect our commerce. No power can challenge us on the waves; the Mediterranean has become our sea once more."
ach_mission_events.9.a: "The Roman sea"
ach_mission_events.9.b: "Trade and empire"

# === EVENT: ROMAN EMPIRE RECONQUERED ===
ach_mission_events.10.t: "The Empire Restored"
ach_mission_events.10.d: "The dream of a Roman Empire, united from the Adriatic to the Euphrates, has been realized. The peoples of Greece, Asia Minor, and the Levant are united under our rule, and the old empire of the Caesars lives again in Latin guise. The legacy of Rome endures."
ach_mission_events.10.a: "The Eternal Empire"
ach_mission_events.10.b: "A new golden age begins"

# ==================== EVENT TOOLTIPS ====================

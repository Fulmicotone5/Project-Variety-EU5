 PV_ans_m: "Rise of the Hohenzollern"
 PV_ans_m_DESCRIPTION:0 "From the small Electorate of Ansbach, build a Kingdom under the Hohenzollerns, and achieve Greatness."
 PV_ans_m_CRITERIA_DESCRIPTION:0 "Establish Franconia or Prussia, form either the North or South German Federation."
 PV_ans_m_BUTTON_TOOLTIP:0 "From the sandbox of the Holy Roman Empire to the hegemon of Europe."
 PV_ans_m_BUTTON_DETAILS:0 "Establish Franconia or Prussia, form either the North or South German Federation"
 bra_the_great1: "The Great"
 bra_the_great1_desc: "Frederick II has achieved what only a handful of men in the history of humanity have, and for that, he can truly be considered one of the 'Great'"
 bra_ascanian_legacy1: "Legacy of the Ascanians"
 bra_ascanian_legacy1_desc: "Inherit the Margraviate of Brandenburg built by the House of Ascania, and begin a new age of rule."
 bra_march_authority1: "Establish Margravial Authority"
 bra_march_authority1_desc: "Curb the fragmented noble lands, and let the Margrave's authority reach across the realm."
 bra_altmark_secure1: "Secure the Altmark"
 bra_altmark_secure1_desc: "The Altmark, birthplace of the March — make its rule unshakeable."
 bra_neumark_colonization1: "Colonize the Neumark"
 bra_neumark_colonization1_desc: "Push eastward colonization into the Neumark beyond the Oder, and build new settlements."
 bra_uckermark_integration1: "Integrate the Uckermark"
 bra_uckermark_integration1_desc: "Fully incorporate the Uckermark into the Margraviate."
 bra_pomeranian_rivalry1: "Rivalry with Pomerania"
 bra_pomeranian_rivalry1_desc: "Settle the rivalry with the Duchy of Pomerania over access to the Baltic Sea."

 pvsouthptoolt: "You have taken the Southern Path"
 pvnorthptoolt: "You have taken the Nothern Path"
 pvelector_of_ans: "The Electorate of [ROOT.GetCountry.GetName]"
 pvelector_of_ans_desc: "The Electorate of Ansbach has risen in prominence in recent years thanks to the support the House of Hohenzollern has given to the holy Roman Emperor.\nThe electorship was granted to Ansbach in 1335, and the country now stands as the next new regional power of East Germany, potentially capable of rivaling even the mighty [GetCountry('BOH').GetName]; but history is yet to be written, and fate is quick to turn against one's fortune."
 pvnew_threat: "A New Threat on the Horizon"
 pvnew_threat_desc: "Following the acquisition of the Margraviate of Landsberg, and the reunification of the Wettin lands, [GetCountry('MEI').GetName] has emerged has a new threat to our prominence in the region."
 pvoremines: "[ShowProvinceDefinitionName('erzgebirge_province')] Reclaimed!"
 pvoremines_desc: "Lost decades ago, this ore-rich county will once again provide Ansbach with precious resources that would otherwise support our contenders to the hegemony of Franconia and Saxony."
 pvsilverandgold: "Marble and Gold"
 pvsilverandgold_desc: "Following the recent expansion of [ShowLocationName('hof')], discussions have commenced between the Nobility and the Burghers wether the Crown should prioritize the expansion of the neighboring marble mines of [ShowLocationName('wunsiedel')], or the gold mines of [ShowLocationName('bayreuth')];
 pvrisingpower: "A Rising Regional Power"
 pvrisingpower_desc: "At long last Ansbach has established itself as one the most prominent powers of East Germany, but that has also brought to us many rivals and enemies.
 pv_towardsprussia: "Towards [ShowAreaName('prussia_area')]"
 pv_towardsprussia_desc: "If we want to reach [ShowAreaName('prussia_area')], Berlin stands in our path.
 pvtobecomeaking: "To Become a Kingdom"
 pvtobecomeaking_desc: "The Hohenzollern House has no claim over any Kingdom in the [holy_roman_empire|e], but the lands of [ShowAreaName('prussia_area')] reside just outside of the Empire, and the [ShowCultureName('prussian')] people is yet to be guided by a King.
 pvnecappru: "A New Capital?"
 pvnecappru_desc: "Following the decision to concentrate our efforts towards [ShowAreaName('prussia_area')], the Cabinet and the Military have strongly recommended for the relocation of the Court to [ShowLocationName('hof')], a better suited location for our objectives.
 pvnecappru2: "The Matter of [ShowLocationName('hof')]"
 pvnecappru2_desc: "Following the decision to concentrate our efforts towards the East and the South, the Burghers of [ShowLocationName('hof')] have begun exerting pressure on the Crown seeking increased autonomy.
 pvrestore_franconia: "Restoring [ShowAreaName('franconia_area')]"
 pvrestore_franconia_desc: "Once the seat of a powerful stem duchy, [ShowAreaName('franconia_area')] has declined over the centuries, and the associated title of Duke of [ShowAreaName('franconia_area')] has become nominal and irrelevant."
 pvfranconiarestored: "[ShowAreaName('franconia_area')] Restored!"
 pvfranconiarestored_desc: "Through the reassertion of our sovereignty and the consolidation of our dominion over this historic region, we have successfully revitalized the former glory of [ShowAreaName('franconia_area')]."
 pvsouth_german_federationev: "A South German Kingdom"
 pvsouth_german_federationev_desc: "A most distinguished Kingdom has been solemnly founded in [ShowRegionName('south_german_region')], marking a momentous milestone in history."
 pvrichesof: "The Riches of [ShowProvinceDefinitionName('plzensko_province')]"
 pvrichesof_desc: "Recently a man originating from [ShowLocationName('klatovy')], requested an audience with the Crown, asserting himself to be the rightful heir to the County of [ShowProvinceDefinitionName('plzensko_province')], contending that an illegitimate usurper currently holds the title."
 pvegenpass: "The [ShowLocationName('cheb')] Valley Pass"
 pvegenpass_desc: "Following the conquest of [ShowLocationName('plzen')], the realm of Franconia has been divided into two distinct regions. The Bohemian Massif renders any form of connectivity with [ShowAreaName('bohemia_area')] exceedingly difficult, thereby impeding commerce and movement between these territories.
 pvcontrol_bohemia: "Control Bohemia"
 pvcontrol_bohemia_desc: "Bohemia is the richest region of central Europe, it is imperative for us to finish the conquest."
 pvcontrol_bavaria: "The Conquest of Bavaria"
 pvcontrol_bavaria_desc: "Center of the Imperial power, if we aim to dominate South Germany, we can't but force Bavaria into submission."
 pvcontrol_austria: "Control Austria"
 pvcontrol_austria_desc: "Show no mercy to the Habsburg."
 pvcontrol_moravia: "Seize Moravia"
 pvcontrol_moravia_desc: "Incredibly rich in ores, the conquest of Moravia would be of great use of the Electorate."
 bra_standing_army12: "Establish the Prussian Grenadiers"
 bra_standing_army12_desc: "The Prussian Grenadiers were elite infantry soldiers in the Prussian Army known for their height, discipline, and signature mitre caps."

 bra_standing_army1: "Establish a Standing Army"
 bra_standing_army1_desc: "Create a standing army answerable directly to the Elector, not reliant on noble levies."
 fredegriss: "Frederick II von Hohenzollern is the current ruler"
 bra_absolutism1: "Establish Absolutist Rule"
 bra_absolutism1_desc: "Curb the power of the Estates, and build a state where the Elector's will reaches every corner."
 bra_sovereign_prussia1: "Sovereignty over Prussia"
 bra_sovereign_prussia1_desc: "By the Treaty of Oliva, cast off Polish suzerainty over the Duchy of Prussia."
 bra_king_in_prussia1: "Crowned King in Prussia"
 bra_king_in_prussia1_desc: "In 1701 at Königsberg, Frederick I crowned himself 'King in Prussia.'"
 bra_prussian_administration1: "Prussian Administration"
 bra_prussian_administration1_desc: "Establish an efficient and disciplined bureaucracy, and walk the path toward a modern state."
 bra_junker_integration1: "Integrate the Junkers"
 bra_junker_integration1_desc: "Bring the Junker landed nobility east of the Elbe into the core of army and administration."
 bra_potsdam_dev1: "Develop Potsdam"
 bra_potsdam_dev1_desc: "Develop Potsdam, seat of the royal residence, into a center of court culture."
 bra_soldier_king1: "Legacy of the Soldier King"
 bra_soldier_king1_desc: "Inherit the frugal, militaristic legacy of Frederick William I, the 'Soldier King.'"
 bra_royal_treasury1: "A Full Royal Treasury"
 bra_royal_treasury1_desc: "Through frugal fiscal management, build one of the fullest treasuries in Europe."
 bra_silesian_ambition1: "Ambitions in Silesia"
 bra_silesian_ambition1_desc: "Assert a legitimate claim to rich Silesia, ruled by the House of Habsburg."
 bra_first_silesian_war1: "The First Silesian War"
 bra_first_silesian_war1_desc: "The young Frederick II marches into Silesia in a lightning invasion."
 bra_silesia_annexed1: "Silesia Annexed"
 bra_silesia_annexed1_desc: "Fully annex the rich mining and industrial region of Silesia as Prussia's economic foundation."
 bra_prussian_enlightenment1: "The Prussian Enlightenment"
 bra_prussian_enlightenment1_desc: "Enlightenment thought blossoms under Frederick the Great — embody the ideal that 'the king is the first servant of the state.'"
 bra_seven_years_war1: "Endure the Seven Years' War"
 bra_seven_years_war1_desc: "The Seven Years' War pits all Europe against you — endure this trial and defend your status as a great power."
 bra_frederick_the_great1: "Road to Greatness"
 bra_frederick_the_great1_desc: "Carry the legacy of the great king remembered as 'Frederick the Great' into the next age."
 bra_partitions_of_poland1: "Conquest of Greater Poland"
 bra_invasion_of_poland1: "Invasion of Poland"
 bra_invasion_of_poland1_desc: "March our forces into Greater Poland, and carve away territory from this weakened neighbor."
 bra_partitions_of_poland1_desc: "Join in the partitioning of the declining Polish-Lithuanian Commonwealth, and gain West Prussia."
 bra_prussian_academy1: "The Prussian Academy of Sciences"
 bra_prussian_academy1_desc: "Cultivate the Berlin Academy of Sciences, and become a center of learning and science."
 bra_prussian_army_reform1: "Prussian Army Reform"
 bra_prussian_army_reform1_desc: "Quality or quantity — define the character of the Prussian army, and root a distinctive military doctrine in the state."
 bra_napoleonic_crisis1: "The Napoleonic Crisis"
 bra_napoleonic_crisis1_desc: "Defeat at Jena-Auerstedt — before Napoleon, Prussia faces a crisis of survival."
 bra_stein_hardenberg_reforms1: "The Stein-Hardenberg Reforms"
 bra_stein_hardenberg_reforms1_desc: "The time has come to undermine the fiscal foundations of a France that still outweighs us — through the emancipation of serfs and administrative reform, achieve rebirth from crisis."
 bra_rhineland_acquisition1: "Acquire the Rhineland"
 bra_rhineland_acquisition1_desc: "Gain the rich territories along the Rhine, and lay the foundation for industrialization."
 bra_show_of_strength1: "A Show of Strength"
 bra_show_of_strength1_desc: "Before reaching for the great expanses of Germany, demonstrate Prussia's might to the princes of the north."
 bra_lower_saxony_conquest1: "Conquer Lower Saxony"
 bra_lower_saxony_conquest1_desc: "Defeat our rivals in Lüneburg and Magdeburg, secure the port of Emden in Holstein, and extend our reach across Lower Saxony."
 bra_westphalian_conquest1: "Westphalian Conquest"
 bra_westphalian_conquest1_desc: "Extend our hegemony over northern Germany further west, into the lands of Westphalia."
 bra_zollverein1: "The Zollverein"
 bra_zollverein1_desc: "Lead the Zollverein, the customs union that economically unites the German states."
 bra_prussian_constitution1: "The German Constitution"
 bra_prussian_constitution1_desc: "Establish the framework of constitutional monarchy."
 bra_army_reform_1860s1: "Army Reforms"
 bra_army_reform_1860s1_desc: "The military reforms of Roon and Moltke — refine the military doctrine of quality or quantity chosen earlier to even greater heights."
 bra_danish_war1: "War against Denmark"
 bra_danish_war1_desc: "Take up arms against Denmark over the Schleswig-Holstein question."
 bra_austro_prussian_war1: "The Austro-Prussian War"
 bra_austro_prussian_war1_desc: "Settle the matter at the Battle of Königgrätz, and win leadership of Germany."
 bra_north_german_confederation1: "The North German Confederation"
 bra_north_german_confederation1_desc: "Unite the German states north of the Main, excluding Austria, and found the North German Confederation."
 bra_alsace_lorraine_annexed1: "Alsace-Lorraine Seized"
 bra_alsace_lorraine_annexed1_desc: "Annex Alsace and Lorraine as spoils of war, etching a lasting enmity with France."
 bra_german_empire1: "The German Empire Founded"
 bra_german_empire1_desc: "Establish the German Empire, with the King of Prussia as Emperor, as Europe's newest great power."
 bra_kulturkampf1: "The Kulturkampf"
 bra_kulturkampf1_desc: "Curb the influence of the Catholic Church, and redefine the relationship between state and church."
 bra_social_legislation1: "Social Insurance Legislation"
 bra_social_legislation1_desc: "Establish sickness, accident, and old-age insurance systems as a countermeasure against socialism."
 bra_colonial_empire1: "A Colonial Empire"
 bra_colonial_empire1_desc: "Seeking 'a place in the sun,' build colonies in Africa and the Pacific."
 bra_high_seas_fleet1: "The High Seas Fleet"
 bra_high_seas_fleet1_desc: "Under Admiral Tirpitz's direction, build a High Seas Fleet capable of rivaling Britain."
 bra_weltpolitik1: "Weltpolitik"
 bra_weltpolitik1_desc: "Under Wilhelm II's banner of 'world policy,' take your place among the world's great powers."
 bra_berlin_metropolis1: "Greater Berlin Complete"
 bra_berlin_metropolis1_desc: "Develop Berlin into a world city to rival Paris and London."
 bra_ruhr_industry_complete1: "Ruhr Industry Complete"
 bra_ruhr_industry_complete1_desc: "Push the industrial might of the Ruhr to its limits, becoming one of the world's great heavy-industrial powers."
 bra_german_science1: "The Rise of German Innovation"
 bra_german_science1_desc: "Build a golden age of German science, leading the world in physics and chemistry."
 bra_hegemon_of_europe1: "Mitteleuropa"
 bra_hegemon_of_europe1_desc: "Establish unrivaled hegemony over Europe in economy, military, and diplomacy alike."
 bra_second_reich_eternal1: "The German Empire"
 bra_second_reich_eternal1_desc: "From a small frontier march to an empire ruling Europe — the story of the House of Hohenzollern reaches its completion."

# ==================== PERSIAN MISSION EVENTS ====================
persian_mission_events.1.t: "The Restoration of the Zoroastrian Faith"
persian_mission_events.1.d: "Our scholars have uncovered ancient Zoroastrian texts and rituals from the holy sites of Yazd, Kashmar, and Istakhr. The priests of the old faith still linger in these places, and the people murmur of a return to the ways of their ancestors. The Shah now faces a choice that will shape the destiny of Persia for generations."
persian_mission_events.1.a: "Restore the Ancient Faith of our Fathers"
persian_mission_events.1.b: "The Faith of the Prophet is the Way of the Future"

persian_mission_events.2.t: "The Sacred Fire Burns Bright"
persian_mission_events.2.d: "The sacred fires of Zoroastrianism have been rekindled across Persia. At Yazd, Kashmar, and Istakhr, the flames burn bright as they did in the days of the Sassanids. The priests have re-established the ancient rituals, and pilgrims are beginning to return to the holy sites. Persia has truly returned to the faith of its ancestors."
persian_mission_events.2.a: "Let the Light of Ahura Mazda Guide Us"

persian_mission_events.3.t: "The People Embrace the Ancient Faith"
persian_mission_events.3.d: "Across the Persian heartland, the people have embraced Zoroastrianism with fervor. The temples are full, the sacred fires are tended, and the priests have regained their ancient authority. Persia has become a bastion of the faith, and our missionaries spread the word of Zoroaster far and wide."
persian_mission_events.3.a: "The Faith is Secure"

persian_mission_events.4.t: "The Fall of the Temples"
persian_mission_events.4.d: "Our armies have marched against the enemies of Zoroaster, destroying their temples and proving the superiority of our faith. The Sunni powers tremble before us, and the Shah is hailed as the Defender of the Faith. The glory of Zoroastrian Persia is reborn."
persian_mission_events.4.a: "The Faith Triumphs"

persian_mission_events.5.t: "The Rise of the Ctesiphon Patriarchate"
persian_mission_events.5.d: "The Zoroastrian Patriarchate has been restored to its ancient seat of power. The Patriarch of Ctesiphon guides the faith and advises the Shah on matters of religion. Persia has a spiritual leader who rivals the Pope and the Caliph in authority and prestige. The restoration of the ancient faith is complete."
persian_mission_events.5.a: "The Light Shines Forever"

persian_mission_events.6.t: "The Persian Renaissance"
persian_mission_events.6.d: "Persia has entered a golden age of arts, culture, and science. Our poets, painters, and philosophers are the envy of the world. Our astronomers map the heavens, our physicians cure diseases, and our mathematicians unlock the secrets of the universe. The Persian Renaissance has begun, and its light will shine for centuries to come."
persian_mission_events.6.a: "The Light of Knowledge"

persian_mission_events.7.t: "The Restoration of the Empire"
persian_mission_events.7.d: "The Persian Empire has been restored to its ancient glory. From the Indus to the Mediterranean, from the Caucasus to the Persian Gulf, all lands bow to the Shahanshah. The legacy of Cyrus and the Sassanids is fulfilled, and Persia stands as the greatest power in the known world."
persian_mission_events.7.a: "The King of Kings"


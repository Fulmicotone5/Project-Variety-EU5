# ==================== PERSIAN MISSION PACK HEADER ====================
persia_missions: "Persia: Legacy of the Kings of Kings"
persia_missions_desc: "Unite the Persian heartlands, restore the ancient empire, and establish Iran as the preeminent power in the Middle East."
persia_missions_BUTTON_TOOLTIP: "Complete missions to strengthen Persia and establish dominance from the Indus to the Mediterranean."
persia_missions_CRITERIA_DESCRIPTION: "Consolidate the Persian provinces, expand your borders, and restore the legacy of Cyrus and the Sassanids to unlock powerful modifiers and traditions."

# ==================== PERSIAN UNIFICATION MISSIONS ====================
mission_per_consolidate_persian_heartland: "Consolidate the Persian Heartland"
mission_per_consolidate_persian_heartland_desc: "Secure control over the core Persian territories of Fars and Isfahan to establish a strong foundation for the Persian state."

mission_per_develop_isfahan: "Develop Isfahan"
mission_per_develop_isfahan_desc: "Transform our capital into a thriving cultural and economic center worthy of the Persian crown, rivaling the great cities of the ancient world."

mission_per_develop_isfahan_tooltip: "Isfahan must have at least 35 development, a marketplace, a library, and our monthly trade and tax income must exceed 30 gold."

mission_per_strengthen_shah_authority: "Strengthen Shah Authority"
mission_per_strengthen_shah_authority_desc: "Secure the support of the nobility and clergy while centralizing power in the hands of the Shah to ensure effective governance."

mission_per_establish_royal_treasury: "Establish Royal Treasury"
mission_per_establish_royal_treasury_desc: "Create a secure royal treasury to fund our ambitions, stabilize the economy, and reduce dependence on provincial tax collection."

mission_per_promote_persian_culture: "Promote Persian Culture"
mission_per_promote_persian_culture_desc: "Foster a golden age of Persian arts, literature, and learning, establishing Persian as the dominant cultural force in the region."
mission_per_promote_occ_culture: "Promote Occitan Culture"
mission_per_promote_occ_culture_desc: "Foster a golden age of Occitan arts, literature, and learning, establishing Occitan as the dominant cultural force in the region."
mission_per_promote_occ_culture1: "Wandering Troubadors"
mission_per_promote_occ_culture1_desc: "The troubadours are medieval poet-musicians that originated in the 11th century in Occitania. They are renowned for their lyrical poetry, often focused on themes of chivalry, courtly love, and personal devotion, which they performed with music, typically accompanying themselves on instruments like the lute or vielle. As their presence has slowly faded in the last decades, we can make one last ditch attempt to revive their institution."

# ==================== MILITARY CONSOLIDATION MISSIONS ====================
mission_per_invest_into_the_army: "Invest into the Army"
mission_per_invest_into_the_army_desc: "Modernize and expand our military forces to defend our realm, secure our borders, and pursue our imperial ambitions."

mission_per_secure_fars: "Secure Fars"
mission_per_secure_fars_desc: "Bring the rich lands of Fars under complete Persian control to strengthen our economy, manpower, and cultural heartland."

mission_per_spread_influence: "Spread Persian Influence"
mission_per_spread_influence_desc: "Expand Persian cultural and political influence, making Persia the dominant power in the region."

mission_per_integrate_lands: "Integrate the Borderlands"
mission_per_integrate_lands_desc: "Fully integrate the newly conquered border territories into the Persian administrative system, ensuring lasting control and economic development."

mission_per_control_gulf_of_oman: "Control the Gulf of Oman"
mission_per_control_gulf_of_oman_desc: "Secure Persian dominance over the Gulf of Oman, controlling the vital maritime routes that connect the Persian Gulf to the Indian Ocean."

mission_per_control_persian_gulf: "Complete Persian Gulf Control"
mission_per_control_persian_gulf_desc: "Establish total Persian control over the entire Persian Gulf coastline, from the Shatt al-Arab to the Strait of Hormuz, securing our maritime trade and naval supremacy."

mission_per_western_expansion: "Expand Westward"
mission_per_western_expansion_desc: "Restore Persian borders westward into the lands of Khuzestan, reclaiming territories."

mission_per_subjugate_the_provinces: "Subjugate the Provinces"
mission_per_subjugate_the_provinces_desc: "Assert Persian dominance over the surrounding provinces, bringing Kerman and Isfahan fully under the Shah's authority."

mission_per_challenge_the_ilkhanate: "Challenge the Ilkhanate"
mission_per_challenge_the_ilkhanate_desc: "Assert Persian dominance over the remnants of the Ilkhanate, establishing ourselves as the rightful heirs to their empire."

# ==================== EASTERN EXPANSION MISSIONS ====================
mission_per_secure_khorasan: "Secure Khorasan"
mission_per_secure_khorasan_desc: "Bring the strategic lands of Khorasan under Persian control to secure our eastern frontier and control the Silk Road."

mission_per_control_the_silk_road: "Control the Silk Road"
mission_per_control_the_silk_road_desc: "Establish Persian dominance over the Silk Road trade routes, bringing immense wealth and cultural exchange to our realm."

mission_per_integrate_the_turks: "Integrate the Turks"
mission_per_integrate_the_turks_desc: "Incorporate the Turkic peoples of the region into our empire, benefiting from their martial traditions and expanding our demographic base."

mission_per_fortify_eastern_border: "Fortify Eastern Border"
mission_per_fortify_eastern_border_desc: "Build a formidable line of fortifications along our eastern frontier to protect against nomadic incursions and secure our borders."

# ==================== ECONOMIC DEVELOPMENT MISSIONS ====================
mission_per_develop_agricultural_heartland: "Develop Agricultural Heartland"
mission_per_develop_agricultural_heartland_desc: "Maximize the productivity of Persia's fertile farmlands, ensuring food security and economic prosperity."

mission_per_develop_rural_economy: "Develop Rural Economy"
mission_per_develop_rural_economy_desc: "Improve the productivity of Persia's vast agricultural lands, boosting grain and wool production."

mission_per_establish_carpet_trade: "Establish Carpet Trade"
mission_per_establish_carpet_trade_desc: "Develop a world-renowned carpet industry, turning Persian wool into valuable exports that enrich our merchants and treasury."

mission_per_develop_persian_manufactories: "Develop Persian Manufactories"
mission_per_develop_persian_manufactories_desc: "Establish a robust manufacturing base for cloth and tools, reducing dependence on foreign imports and creating new sources of wealth."

mission_per_control_persian_gulf_trade: "Control Persian Gulf Trade"
mission_per_control_persian_gulf_trade_desc: "Establish Persian naval dominance over the Persian Gulf, securing lucrative trade routes to India, Arabia, and East Africa."

# ==================== WESTERN EXPANSION MISSIONS ====================
mission_per_secure_mesopotamia: "Secure Mesopotamia"
mission_per_secure_mesopotamia_desc: "Bring the ancient lands of Mesopotamia under Persian control, securing our western frontier and the cradle of civilization."

mission_per_sacred_cities: "Protect the Sacred Cities"
mission_per_sacred_cities_desc: "Place the Shi'a holy cities of Najaf and Karbala under Persian protection, establishing ourselves as the champions of Twelver Shi'ism."

mission_per_claim_anatolia: "Claim Anatolia"
mission_per_claim_anatolia_desc: "Assert Persian claims to Anatolia, challenging Ottoman dominance and restoring the ancient borders of the Sassanid Empire."

mission_per_challenge_ottomans: "Challenge the Ottomans"
mission_per_challenge_ottomans_desc: "Confront the Ottoman Empire on the battlefield, proving Persian military superiority and securing our western borders."

mission_per_secure_the_levant: "Secure the Levant"
mission_per_secure_the_levant_desc: "Extend Persian control over the Levantine coast, connecting our empire to the Mediterranean and securing important trade routes."

# ==================== CULTURAL & RELIGIOUS DEVELOPMENT MISSIONS ====================
mission_per_establish_isfahan_university: "Establish Isfahan University"
mission_per_establish_isfahan_university_desc: "Create a center of learning that will attract scholars from across the Islamic world and beyond."

mission_per_promote_persian_language: "Promote Persian Language"
mission_per_promote_persian_language_desc: "Spread the use of Persian as the language of literature, administration, and culture throughout our realm."

mission_per_promote_shia_islam: "Promote Shi'a Islam"
mission_per_promote_shia_islam_desc: "Establish Twelver Shi'ism as the dominant faith of the empire, building the necessary religious infrastructure and securing the loyalty of the clergy."

mission_per_counter_sunni_influence: "Counter Sunni Influence"
mission_per_counter_sunni_influence_desc: "Push back against Sunni religious influence in our region, positioning Persia as the leader of the Shi'a world."

mission_per_promote_sufi_tolerance: "Promote Sufi Tolerance"
mission_per_promote_sufi_tolerance_desc: "Encourage a policy of religious tolerance that accommodates Sufi orders and other mystical traditions, maintaining social harmony."

# ==================== MILITARY MODERNIZATION MISSIONS ====================
mission_per_reform_persian_army: "Reform the Persian Army"
mission_per_reform_persian_army_desc: "Modernize our military forces to maintain our edge against emerging threats, reducing noble influence in favor of professional soldiers."

mission_per_establish_ghulams: "Establish the Ghulams"
mission_per_establish_ghulams_desc: "Create an elite corps of slave-soldiers loyal only to the Shah, providing a powerful military force free from noble influence."

mission_per_develop_persian_artillery: "Develop Persian Artillery"
mission_per_develop_persian_artillery_desc: "Build a modern artillery corps, harnessing Persia's iron and copper resources to produce powerful siege weapons."

mission_per_build_siege_workshops: "Build Siege Workshops"
mission_per_build_siege_workshops_desc: "Establish specialized workshops dedicated to producing siege equipment, enhancing our ability to capture fortified positions."

# ==================== ESTATE MANAGEMENT MISSIONS ====================
mission_per_balance_estates: "Balance the Estates"
mission_per_balance_estates_desc: "Manage the competing interests of the nobles, clergy, merchants, and peasants while maintaining royal authority."

mission_per_centralize_authority: "Centralize Authority"
mission_per_centralize_authority_desc: "Reduce the power of provincial governors and noble factions, establishing the Shah as the unquestioned ruler of the empire."

# ==================== GREAT ACHIEVEMENT MISSIONS ====================
mission_per_persian_golden_age: "The Persian Golden Age"
mission_per_persian_golden_age_desc: "Usher in a period of unprecedented cultural, economic, and military prosperity for Persia, rivaling the glories of the Achaemenid and Sassanid empires."

# ==================== PERSIA-SPECIFIC MISSIONS (IRA ONLY) ====================
# --- Imperial Ambitions ---
mission_per_restore_sassanid_borders: "Restore the Sassanid Borders"
mission_per_restore_sassanid_borders_desc: "Reclaim the historic borders of the Sassanid Empire, from Anatolia to Transoxiana, restoring Persia to its ancient glory."

mission_per_claim_the_legacy_of_cyrus: "Claim the Legacy of Cyrus"
mission_per_claim_the_legacy_of_cyrus_desc: "Position Persia as the successor to the Achaemenid Empire, claiming the mantle of Cyrus the Great and his glorious legacy."

mission_per_establish_new_imperial_guard: "Establish the New Imperial Guard"
mission_per_establish_new_imperial_guard_desc: "Create a new Praetorian-like guard to protect the Shah and serve as the elite core of the Persian army."

mission_per_azarbaijan_protectorate: "Establish the Azerbaijan Protectorate"
mission_per_azarbaijan_protectorate_desc: "Secure Persian influence over the Caucasus region, establishing protectorates in Azerbaijan and Armenia."

# --- Diplomatic & Cultural ---
mission_per_establish_royal_road: "Establish the Royal Road"
mission_per_establish_royal_road_desc: "Construct a network of royal roads connecting the major cities of the empire, facilitating trade, administration, and troop movements."

mission_per_patron_of_arts: "Patron of the Arts"
mission_per_patron_of_arts_desc: "Become the greatest patron of the arts in the Islamic world, attracting artists, poets, and architects to your court."

mission_per_persian_miniatures: "Persian Miniatures"
mission_per_persian_miniatures_desc: "Develop a distinctive Persian miniature painting style that becomes the envy of courts across Eurasia."

mission_per_establish_royal_library: "Establish the Royal Library"
mission_per_establish_royal_library_desc: "Build a magnificent royal library that preserves Persian knowledge and attracts scholars from around the world."

mission_per_embrace_renaissance: "Embrace the Renaissance"
mission_per_embrace_renaissance_desc: "Adopt Renaissance ideas and institutions, fusing them with Persian tradition to create a unique cultural renaissance."

# --- Expansion ---
mission_per_expand_into_india: "Expand into India"
mission_per_expand_into_india_desc: "Establish Persian presence in the Indian subcontinent, securing access to its immense wealth and trade networks."

mission_per_dominate_indian_ocean_trade: "Dominate Indian Ocean Trade"
mission_per_dominate_indian_ocean_trade_desc: "Establish Persian naval supremacy in the Indian Ocean, controlling the spice trade and other lucrative sea routes."

mission_per_conquer_hormuz: "Conquer Hormuz"
mission_per_conquer_hormuz_desc: "Capture the strategic island of Hormuz, securing control over the entrance to the Persian Gulf and a key trade node."

# --- Administrative ---
mission_per_implement_divan_reform: "Implement Divan Reform"
mission_per_implement_divan_reform_desc: "Reform the imperial council to make it more efficient and loyal to the Shah, replacing hereditary appointments with merit-based selection."

mission_per_establish_bureaucracy: "Establish Imperial Bureaucracy"
mission_per_establish_bureaucracy_desc: "Create a professional civil service to administer the empire, reducing reliance on local governors and noble families."

mission_per_tax_reform: "Tax Reform"
mission_per_tax_reform_desc: "Implement a comprehensive tax reform that increases revenue, reduces corruption, and ensures fair collection across the empire."

# --- Military & Defensive ---
mission_per_establish_frontier_marches: "Establish Frontier Marches"
mission_per_establish_frontier_marches_desc: "Organize the border regions into military frontier zones, providing defense against external threats and generating revenue from border trade."

mission_per_develop_military_academy: "Develop Military Academy"
mission_per_develop_military_academy_desc: "Establish a prestigious military academy that produces professional officers and military thinkers for the Persian army."

mission_per_create_elite_corps: "Create Elite Corps"
mission_per_create_elite_corps_desc: "Form elite military units from the best soldiers in the empire, creating a strike force capable of defeating any enemy."

# --- Diplomatic ---
mission_per_establish_diplomatic_network: "Establish Diplomatic Network"
mission_per_establish_diplomatic_network_desc: "Build a sophisticated network of embassies and diplomats to advance Persian interests abroad."

mission_per_mediate_regional_conflicts: "Mediate Regional Conflicts"
mission_per_mediate_regional_conflicts_desc: "Position Persia as a regional mediator, using diplomacy to resolve conflicts and expand our influence without war."

mission_per_secure_tributaries: "Secure Tributaries"
mission_per_secure_tributaries_desc: "Establish a network of tributary states around Persia's borders, providing additional revenue and strategic depth."

mission_per_persian_diplomacy: "Persian Diplomacy"
mission_per_persian_diplomacy_desc: "Perfect the art of Persian diplomacy, using culture, gifts, and strategic marriages to advance our interests."

# --- Infrastructure & Development ---
mission_per_develop_irrigation: "Develop Irrigation Systems"
mission_per_develop_irrigation_desc: "Invest in irrigation infrastructure to turn Persia's arid regions into productive farmland."

mission_per_develop_qanats: "Develop Qanat Systems"
mission_per_develop_qanats_desc: "Build and restore qanat underground water systems to support agriculture and urban development across the empire."

mission_per_urban_development: "Urban Development"
mission_per_urban_development_desc: "Promote urban growth across the empire, developing major cities into centers of commerce, culture, and administration."

# --- Event-style Missions with Choices ---
mission_per_choose_capital: "Choose the Imperial Capital"
mission_per_choose_capital_desc: "Select the permanent capital of the Persian Empire, investing heavily in its development and prestige."

mission_per_architectural_wonders: "Architectural Wonders"
mission_per_architectural_wonders_desc: "Commission magnificent architectural works that rival the wonders of the ancient world."

mission_per_spread_persian_culture: "Spread Persian Culture"
mission_per_spread_persian_culture_desc: "Promote Persian culture, language, and customs throughout the empire and beyond."

mission_per_persian_science: "Persian Science"
mission_per_persian_science_desc: "Build a scientific tradition that advances knowledge in astronomy, medicine, mathematics, and philosophy."

# --- Final Capstone Missions ---
mission_per_persian_renaissance: "The Persian Renaissance"
mission_per_persian_renaissance_desc: "The culmination of Persian cultural and artistic achievements, ushering in a golden age of intellectual and creative brilliance."

mission_per_restore_persian_empire: "Restore the Persian Empire"
mission_per_restore_persian_empire_desc: "Fulfill the prophecy of the restoration of the Persian Empire, uniting all lands from the Indus to the Mediterranean under the Shahanshah."

# ==================== ZOROASTRIAN RELIGION BRANCH MISSIONS ====================
mission_per_restore_ancient_zoroastrian_faith: "Restore the Ancient Zoroastrian Faith"
mission_per_restore_ancient_zoroastrian_faith_desc: "Reclaim the ancient faith of Persia by securing the holy sites of Yazd, Kashmar, and Istakhr, and re-establishing Zoroastrian practice."

mission_per_spread_zoroastrian_unity: "Spread Zoroastrian Unity"
mission_per_spread_zoroastrian_unity_desc: "Promote Zoroastrian unity and conversion within our core territories, establishing a strong foundation for the renewed faith."

mission_per_purify_the_sacred_fire: "Purify the Sacred Fire"
mission_per_purify_the_sacred_fire_desc: "Restore the sacred fires of Zoroastrianism, building great temples at Yazd, Kashmar, and Istakhr and securing supplies of incense for rituals."

mission_per_convert_the_heartland: "Convert the Heartland"
mission_per_convert_the_heartland_desc: "Secure the conversion of the Persian heartland to Zoroastrianism, making it the dominant faith of the region."

mission_per_zoroastrian_missionaries: "Zoroastrian Missionaries"
mission_per_zoroastrian_missionaries_desc: "Send missionaries to neighboring lands to spread the word of Zoroaster and attract converts to our faith."

mission_per_desecrate_the_enemies_temples: "Desecrate the Enemies' Temples"
mission_per_desecrate_the_enemies_temples_desc: "Launch a campaign of religious warfare against our Sunni enemies, destroying their temples and proving the superiority of the Zoroastrian faith."

mission_per_restore_the_sassanid_patriarchate: "Restore the Sassanid Patriarchate"
mission_per_restore_the_sassanid_patriarchate_desc: "Re-establish the Zoroastrian Patriarchate that was destroyed by the Islamic conquest, restoring the institutional structure of the ancient faith."

mission_per_zoroastrian_golden_age: "The Zoroastrian Golden Age"
mission_per_zoroastrian_golden_age_desc: "Usher in a new golden age of Zoroastrian Persia, purifying the empire and restoring the glory of the ancient faith."


l_english:
 consolidated_corruption_of_the_nobles_PV: "Corrupted Elites"
 consolidated_corruption_of_the_nobles_PV_desc: "The entrenched members of the upper classes $corruption_desc$"
 cathar_reforms: "Cathar Reforms"
 cathar_reforms_desc: "A progressive religious reform promoting inclusivity, unity, and understanding among diverse faiths, emphasizing shared values, respect, and spiritual harmony."
 alodial_properties: "Allodial Properties"
 alodial_properties_desc: "Allodial property refers to land that is held in absolute and independent ownership, free from any feudal or government obligations, such as rent or service."
 occitan_nobility: "Occitan Nobility"
 occitan_nobility_desc: "Occitan nobility would favor increased levies if it granted them greater power and influence within their political hierarchy."
 PV_ruling_elites: "Ruling Elites"
 PV_ruling_elites_desc: "Our society was historically composed of a ruling elite of warrior horsemen, a class of free individuals who paid an annual tax; although societal structures have evolved over time, the privileges and responsibilities associated with this class remain in place."
 PV_groschen: "Moravian Groschen"
 PV_groschen_desc: "For several decades, the Moravian nobility has been minting a regional variant of the silver groschen.\n Although our nation does not possess an official currency, the Moravian groschen has gradually established itself as the de facto monetary unit within the country."
 PV_new_coiniage: "New Coinage Rights"
 PV_new_coiniage_desc: "Granting the burghers the authority to coin currency will enable the state to maintain comprehensive control over the minting of its own monetary units."
 PV_silesia_grant: "Monopoly of the Coinage"
 PV_new_coiniage_desc: "Removing the authority of the crown over the coinage can serve to limit inflation; however, this comes at the expense of reducing the state's control over the nation's monetary policy."
 vapnatak: "Vápnatak"
 vapnatak_desc: "The Vápnatak originated as a Scandinavian ritual wherein vassals saluted their newly appointed lord by raising their blades, symbolizing loyalty.\nOver time, it has developed into a complex system of privileges and duties that significantly empower the nobility."
 sokeman: "Sokemen"
 sokeman_desc: "A sokeman is a tenant class member who individually owns, manages, and bears the tax obligations for their land property."
 name_frederick_2: "Friedrich II"
 pv_code_of_chivalry: "Code of Chivalry"
 pv_code_of_chivalry_desc: "Our Nobility has embraced chivalry and chivalric codes of conduct as a social method of regulating behavior. Martial prowess, duty, honor and morality are prized, as is bad poetry and romantic literature."
 PV_staunch_traditionalism: "Staunch Traditionalism"
 PV_staunch_traditionalism_desc: "Tradition is tradition, it is immovable and unchangeable. We must be ready and willing to stand up for what makes us who we are."
 pv_monastic_communities: "Monastic Communities"
 pv_monastic_communities_desc: "Our People has a long history of sending noble progeny to serve the faith. Revered political thinkers often arise from the monastic orders."
 PV_legalism: "Legalistic"
 PV_legalism_desc: "Our People regards the rule of law and its codification as being the most important parameter of a civilized society."
 pv_cuture_blending: "Culture Blending"
 pv_cuture_blending_desc: "Members of our culture have learnt to live alongside people of other cultures. Through exposure, they have become adept at incorporating foreign languages, traditions and customs into their own lives."
 PV_hill_dwellers: "Hill Dwellers"
 PV_hill_dwellers_desc: "Our People is at home in hills, and know how to work its lands effectively."
 PV_mountainshomes: "Mountain Homes"
 PV_mountainshomes_desc: "Our People knows how to live and thrive on plateaus near the harsh slopes of mountains."
 PV_allowed_herbalism: "Medicinal Herbalists"
 PV_allowed_herbalism_desc: "Our People have developed knowledge of the medicinal properties of the plants and trees; to them most ailments are treatable with the right poultice, salve or stew."
 PV_loyalty_to_the_popw: "Loyalty to the Pope"
 PV_loyalty_to_the_popw_desc: "Declaring allegiance to the Pope and the Catholic Church can foster national unity and promote cohesive societal harmony within the country."
 tabletop_warriors: "Tabletop Warriors"
 tabletop_warriors_desc: "Any commander can gamble and get lucky on the day of battle. A #EMP real#! strategist keeps their mind honed through practice and pretend so that they have no #EMP need#! of 'luck'."
 frequent_court_events: "Frequent Court Events"
 frequent_court_events_desc: "The frequency and exuberance with which our court throws festivities would be considered vulgar to others, but a party is a party!"
 PV_wetlands: "Wetlanders"
 PV_wetlands_desc: "Our People has mastered the bogs and marshes. Though life is at times a battle against mold, they have learned to use the peat to their advantage."
 PV_water_rituals: "Water Rituals"
 PV_water_rituals_desc: "The purifying properties of water are an essential part of life for this culture and the ritual of ablution occupies a prominent position in their society."
 PV_mendicant_mystics: "Mendicant Mystics"
 PV_mendicant_mystics_desc: "The holy people of this culture believe strongly that the faith should be ministered in the field, and their most devout frequently wander the world."
 PV_legalised_feud: "Codified Feud Practices"
 PV_legalised_feud_desc: "Feuds are regarded as legitimate legal mechanisms and are subject to certain regulatory frameworks. By codifying these practices, the state can formally acknowledge them as a lawful societal phenomenon, thereby mitigating numerous legal complications for our citizens."
 pvnoblessucc: "Our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] has less or equal to 35% Satisfaction"
 pvburghssucc: "Our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] has less or equal to 35% Satisfaction"

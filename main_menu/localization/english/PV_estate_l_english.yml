l_english:
 consolidated_corruption_of_the_nobles_PV: "Corrupted Elites"
 consolidated_corruption_of_the_nobles_PV_desc: "The entrenched members of the upper classes $corruption_desc$"
 cathar_reforms: "Cathar Reforms"
 cathar_reforms_desc: "A progressive religious reform promoting inclusivity, unity, and understanding among diverse faiths, emphasizing shared values, respect, and spiritual harmony."
 alodial_properties: "Allodial Properties"
 alodial_properties_desc: "Allodial property refers to land that is held in absolute and independent ownership, free from any feudal or government obligations, such as rent or service."
 occitan_nobility: "Occitan Nobility"
 occitan_nobility_desc: "Occitan nobility would favor increased levies if it granted them greater power and influence within their political hierarchy."
 PV_ruling_elites: "Ruling Elites"
 PV_ruling_elites_desc: "Our society was historically composed of a ruling elite of warrior horsemen, a class of free individuals who paid an annual tax; although societal structures have evolved over time, the privileges and responsibilities associated with this class remain in place."
 PV_groschen: "Moravian Groschen"
 PV_groschen_desc: "For several decades, the Moravian nobility has been minting a regional variant of the silver groschen.\n Although our nation does not possess an official currency, the Moravian groschen has gradually established itself as the de facto monetary unit within the country."
 PV_new_coiniage: "New Coinage Rights"
 PV_new_coiniage_desc: "Granting the burghers the authority to coin currency will enable the state to maintain comprehensive control over the minting of its own monetary units."
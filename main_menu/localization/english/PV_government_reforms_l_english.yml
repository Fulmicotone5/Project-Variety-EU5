 PV_vinland: "Vinland"
 PV_vinland_desc: "Vinland, a land of shimmering coasts and untamed wilderness, beckons with its ancient Viking echoes, where legendary explorers sought new horizons amidst whispering winds and boundless ocean dreams."
 japanese_clan_PV: "Satsuma Domain"
 japanese_clan_PV_desc: "Renowned for their mastery of navigation and naval prowess, the Satsuma explorers navigate treacherous seas and mysterious territories, seeking new trade routes, exotic treasures, and ancient secrets. Their ships, adorned with vibrant banners, cut through misty waters as they establish outposts and forge alliances with distant tribes, expanding their influence and knowledge of the mysterious eastern worlds beyond their homeland."
 PV_liqian: "Heirs of Rome"
 PV_liqian_desc: "A Republic founded by the descendants of the Roman legionaries taken prisoner at the Battle of Carrhae; you are the last heirs of the Roman Republic."
 house_of_hohen: "House of Hohenzollern"
 house_of_hohen_desc: " The House of Hohenzollern came from the area around the town of Hechingen in Swabia during the late 11th century and took their name from Hohenzollern Castle. The first ancestors of the Hohenzollerns were mentioned in 1061."
 house_de_bourgogne: "House 'de Bourgogne'"
 house_de_bourgogne_desc: "The House of Burgundy was a cadet branch of the Capetian dynasty, descending from Robert I, Duke of Burgundy, a younger son of King Robert II of France. The House ruled the Duchy of Burgundy from 1032 to 1361 and achieved the recognized title of King of Portugal."
 colonial_administration: "Colonial Administration"
 colonial_administration_desc: "Our nation will concentrate its resources on establishing governance frameworks, optimizing resource management, and developing infrastructure to effectively regulate and harness the colonies' resources."
 PV_agrarian_society: "Land Concessions"
 PV_agrarian_society_desc: "The state authorizes land concessions to the local peasantry."
 PV_metallurgy: "Sponsored Apprenticeship"
 PV_metallurgy_desc: "The states will commence sponsoring individual apprenticeships to enhance the capabilities of the country's artisans."
 PV_artisans_comm: "Communal Festivities"
 PV_artisans_comm_desc: "The state assumes the role of guarantor for the celebration of communalism and communal festivities."
 PV_diplofocus: "Pen Over Sword"
 PV_diplofocus_desc: "It is a common idea in this culture that the purest expression of superiority is the ability to subdue your enemy without fighting them."
 PV_isolationist: "Isolationist"
 PV_isolationist_desc: "This culture prefers to keep to itself, and doesn't often look outside its own sphere."
 PV_state_ransom: "State Ransoming"
 PV_state_ransom_desc: "Every soldier goes into battle ready to risk life and limb for their liege! Does it not behoove the liege to offer them some guarantee of safety, regardless of station, should they be captured in the field?"
 PV_costeffectivness: "Frugal Armorers"
 PV_costeffectivness_desc: "While a set of high-quality armor might save one life, having ten decent sets might win a battle."
 PV_formation_experts: "Formation Fighting Experts"
 PV_formation_experts_desc: "Our Country knows how to create synergy between different types of units by use of efficient protective formations."
 PV_infantry_skirmishers: "Infantry Skirmishers"
 PV_infantry_skirmishers_desc: "Our Country knows knows how to effectively field infantry skirmishers in any environment."
 PV_mercenary_contract_law: "Mercenary Contract Law"
 PV_mercenary_contract_law_desc: "Our Country can become a haven for foreign soldiers looking for work. Why should we risk our own people, when others will fight for us?"
 PV_superior_firepower: "Superior Firepower"
 PV_superior_firepower_desc: "Our Country focuses on throwing projectiles, not men, at the enemy. Our manpower is precious, projectiles are cheap."
 PV_cavalryfocus: "Adaptive Cavalry"
 PV_cavalryfocus_desc: "Our Country knows knows how to effectively field cavalry in any environment."
 PV_spartan: "Spartan"
 PV_spartan_desc: "Our Country doesn't prize the trappings of power anymore - the ceremony, the wealth, the pointless decoration. Our Country is now is more interested in power itself, preferably in the form of towering walls and keeps."
 PV_maritime_power: "Maritime Power"
 PV_maritime_power_desc: "The world may be ruled by armies, but our countries knows that it is truly controlled by whoever dominates the seas."
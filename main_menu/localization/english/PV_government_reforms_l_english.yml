 PV_vinland: "Vinland"
 PV_vinland_desc: "Vinland, a land of shimmering coasts and untamed wilderness, beckons with its ancient Viking echoes, where legendary explorers sought new horizons amidst whispering winds and boundless ocean dreams."
 japanese_clan_PV: "Satsuma Domain"
 japanese_clan_PV_desc: "Renowned for their mastery of navigation and naval prowess, the Satsuma explorers navigate treacherous seas and mysterious territories, seeking new trade routes, exotic treasures, and ancient secrets. Their ships, adorned with vibrant banners, cut through misty waters as they establish outposts and forge alliances with distant tribes, expanding their influence and knowledge of the mysterious eastern worlds beyond their homeland."
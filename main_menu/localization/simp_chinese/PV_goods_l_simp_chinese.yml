l_simp_chinese:
 preserved_meat: "腌制肉"
 preserved_meat_desc: "在中世纪，肉类保存依赖自然方法，如盐腌和熏制，这些方法通过去除水分来防止腐坏，是确保冬季生存的关键过程。"
 smokehouse: "熏房"
 smokehouse_desc: "在中世纪，熏房是用于保存肉类、鱼类乃至蔬菜的重要专用建筑（或顶楼），通过盐渍和冷熏进行保存，这在缺乏冷藏手段的时代至关重要。"
 wood_smoked: "木熏家畜肉"
 latrines: "公共厕所"
 sewers: "下水道"
 bathouse: "公共澡堂"
 bathouse_maintenance: "浴室维护费"
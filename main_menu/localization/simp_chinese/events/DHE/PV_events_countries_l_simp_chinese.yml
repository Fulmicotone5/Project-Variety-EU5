 daneflavor.7.desc: "[ShowLocationName('rutland')]，作为五个创始自治镇之一，在遭受[ShowCultureName('english')]当局数十年的忽视后，已沦为一片荒芜被遗忘之地。所幸，来自[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]的一群商人已筹得近乎充足的资金，准备着手重建城镇以恢复其昔日荣光；只需要国家提供少量资助即可启动该项目。"

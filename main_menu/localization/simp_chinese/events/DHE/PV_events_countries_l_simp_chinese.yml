 daneflavor.7.c: "这些资金在国家手中会得到更好的利用。"
 daneflavor.8.title: "新首都？"
 daneflavor.8.desc: "众多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]成员已明确表示，他们非常希望[ROOT.GetCountry.GetName]能在北海地区确立霸权地位，同时指出[ShowLocationName('london')]从地理角度看确实是更有利于推进这样的雄心壮志的地点。"
 daneflavor.8.a: "[ROOT.GetCountry.GetCapital.GetName]应当继续作为首都！"
 daneflavor.8.b: "为什么不是[ShowLocationName('boston')]？"
 daneflavor.8.c: "[ShowLocationName('london')]将成为新的首都！"
 vinflavor.1.title: "希望之地"
 vinflavor.1.desc: "文兰，以其壮丽的海岸与狂野的土地，承载着定义维京时代的冒险精神与不屈意志，仿佛回荡着探索者寻找新世界的传说。\n如今，这片土地被数个北欧派系瓜分，每个都挣扎于严酷的生存现实，对明日何去何从充满迷茫；他们的命运与崎岖的荒野紧密相连，却也怀着在历史汹涌波涛中发现更光明未来的持久希望。"
 vinflavor.1.a: "未来会是怎样？"
 vinflavor.2.title: "[ROOT.GetCountry.GetCapital.GetName]问题"
 vinflavor.2.desc: "[ROOT.GetCountry.GetCapital.GetName]作为雅尔国的首都延续至今，但随着时间的推移，其地理位置已日益显现出与国家发展需求不相适应的问题。\n许多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]中的有识之士已向我们呈递了若干可供选择的新首都选址方案。"
 vinflavor.2.a: "[ROOT.GetCountry.GetCapital.GetName]应当继续作为[ROOT.GetCountry.GetName]的首都！"
 vinflavor.2.b: "整个岛上没有比[ShowLocationName('akilasiewakik')]更好的港口了"
 vinflavor.2.c: "我们应该把首都迁到祖先的城市，[ShowLocationName('belle_isle')]！"
 vinflavor.2.d: "[ShowLocationName('uashat')]代表[ROOT.GetCountry.GetName]的未来！"
 vinflavor.3.title: "收复[GetCountry('P06').GetName]"
 vinflavor.3.desc: "[GetCountry('P06').GetName]赫尔西尔国作为[ROOT.GetCountry.GetName]雅尔国的一部分已长达数十年，但遗憾的是，由于大饥荒，它在多年前脱离了我们。\n此刻正是我们宣示合法所有权的时机。"
 vinflavor.3.a: "准备武器！"
 vinflavor.4.title: "[GetCountry('P06').GetName]已收复！"
 vinflavor.4.desc: "此次重归一统不仅恢复了地区间的历史纽带，更为经济增长、文化复兴与王国内部的团结铺平了道路，为所有居民带来了更光明的未来。"
 vinflavor.4.a: "[ROOT.GetCountry.GetName]万岁！"
 vinflavor.5.title: "中央集权国家"
 vinflavor.5.desc: "[ROOT.GetCountry.GetName]最终摒弃了其部落传统，转而接受王权统治，建立了一个基于王室权威、中央集权且拥有独立主权的治理结构，标志着其从祖传习俗向一个由君主统治的统一且高贵的王国的重要转变。"
 vinflavor.5.a: "国王万岁！[ROOT.GetCountry.GetName]万岁！"
 vinflavor.6.title: "[ROOT.GetCountry.GetName]王国"
 vinflavor.6.desc: "终于，文兰各部落终于统一在同一旗帜之下，[ROOT.GetCountry.GetName]王国巍然崛起。这个强大的新生国度，凭借力量、团结与坚定意志铸就，预示着一个繁荣与主权的新时代。"
 vinflavor.6.a: "愿[ROOT.GetCountry.GetName]长盛不衰！"
 touflavor.1.title: "[ROOT.GetCountry.GetName]公国"
 touflavor.1.desc: "[ROOT.GetCountry.GetName]公国，因其繁荣的文化与悠久的历史而闻名，历经岁月已成为南[ShowRegionName('france_region')]的主导力量。在这片兴盛的土地上，[ShowReligionName('catharism')]信仰蓬勃发展并被立为国教，塑造着公国的精神与社会结构。清洁派信仰强调灵性纯洁与二元论信条，深刻影响着日常生活、治理方式及艺术创作，形成了一种宗教虔诚与知识探索并存的独特氛围。"
 touflavor.1.a: "未来会是怎样？"
 touflavor.2.title: "游吟诗人"
 touflavor.2.desc: "游吟诗人是中世纪的诗乐艺人，起源于11世纪的奥克西塔尼亚。他们以其抒情诗歌而闻名，诗歌主题常围绕骑士精神、宫廷爱情和个人信仰，并通常用鲁特琴或维埃勒琴等乐器自伴自唱。随着近几十年来他们逐渐销声匿迹，我们可以做最后一次尝试，以复兴这一传统。"
 touflavor.2.a: "就这样吧。"
 touflavor.2.b: "我们没有余钱。"
 touflavor.3.title: "[GetCountry('AQN').GetName]问题"
 touflavor.3.desc: "[GetCountry('AQN').GetName]公国于1153年并入[GetCountry('ENG').GetName]王国。作为一处受异国影响的天主教领土，我们有责任解放这片土地，并将其重建为一个清洁派国家。"
 touflavor.3.a: "准备武器！"
 touflavor.4.title: "改革需要"
 touflavor.4.desc: "尽管身处天主教国家的重重包围之中，[ShowReligionName('catharism')]在该地区的持续存在与繁荣确实令人惊叹。然而，单凭奇迹并不足以保证其长期生存，如今众多农民正呼吁进行改革，以巩固这一信仰的未来。"
 touflavor.4.a: "我们必须改革信仰"
 touflavor.4.b: "没必要跟[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]对着干。"
 touflavor.5.title: "[ROOT.GetCountry.GetName]王国"
 touflavor.5.desc: "终于，[ROOT.GetCountry.GetName]王国成立了。如今霸权力量掌控了这里，这片区域的未来得到了保障。"
 touflavor.5.a: "国王万岁！[ROOT.GetCountry.GetName]万岁！"
 touflavor.6.title: "[ROOT.GetCountry.GetName]王国"
 touflavor.6.desc: "[ROOT.GetCountry.GetName]王国终于建立，如今由霸权力量监督着这片地区，区域的稳定与未来前景得到了保障。"
 touflavor.6.a: "愿[ROOT.GetCountry.GetName]长盛不衰！"
 daneflavor.9.title: "[ROOT.GetCountry.GetCapital.GetName]的庆典"
 daneflavor.9.desc: "街道上绽放出绚丽缤纷的色彩，鲜花盛开，彩旗欢快地飘扬。镇民与[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]都身着最耀眼的华服，沉醉于热闹的宴席、滑稽的弄臣和引人入胜的故事之中。市集里摆满了精美的手工艺品、芬芳的香料和美味的当地小吃，空气中洋溢着欢乐的气息与温暖融洽的节庆氛围。"
 daneflavor.9.a: "欢庆吧！"
 daneflavor.9.b: "不计成本！"
 daneflavor.10.a: "我们无能为力。"
 daneflavor.10.b: "尽一切可能提供帮助！"

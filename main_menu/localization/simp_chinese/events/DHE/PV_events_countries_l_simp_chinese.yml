 liqflavor.1.title: "罗马的继承者"
 liqflavor.1.desc: "[ROOT.GetCountry.GetName]共和国由卡莱战役中被俘的罗马军团后裔所建立。骊靬的居民正是这些罗马战俘的后代，他们被获胜的帕提亚人安置在其东部边境。几个世纪以来，该共和国曾臣服于不同的宗主，这种境遇反而使其社群及共和国制度得以延续至今。"
 liqflavor.1.a: "为了罗马的荣耀！"

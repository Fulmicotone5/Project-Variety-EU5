l_simp_chinese:
 daneflavor.1.title: "最后的诺斯堡垒"
 daneflavor.1.desc: "[ROOT.GetCountry.GetName]最初是作为丹麦王国治下的一个行政区而建立，尤其在丹麦君主背弃我们的传统宗教之后，已逐渐演变为一个事实上独立的实体。历史上，[ROOT.GetCountry.GetName]曾以五大自治镇——[ShowLocationName('lincoln')]、[ShowLocationName('leicester')]、[ShowLocationName('derby')]、[ShowLocationName('nottingham')]与[ShowLocationName('rutland')]——为核心区域，这些城镇作为文化及行政中心，构成了这片土地的力量根基。\n然而历经多次冲突，如今五大自治镇只剩下我们的首都[ShowLocationName('lincoln')]。\n收复被侵占的领土，将是我们重掌这片土地主权之路的第一步。"
 daneflavor.1.a: "愿诸神庇佑我们的事业!"
 daneflavor.2.title: "新王国的诞生"
 daneflavor.2.desc: "[ROOT.GetCountry.GetName]的五个创始行政区成功光复，这些城市将成为国家的文化与政治中心。\n随着领土的收复，该国准备向正式的王国转型。\n今天即是新的[ROOT.GetCountry.GetName]王国的诞生之日。"
 daneflavor.2.a: "[ROOT.GetCountry.GetName]万岁！"
 daneflavor.3.title: "林昆陷落！"
 daneflavor.3.desc: "林昆，即英语中所称的[ShowLocationName('lincoln')]，在被入侵者攻陷之前，数百年来始终是[ROOT.GetCountry.GetName]至关重要的[ROOT.GetCountry.GetAdjective]城市。\n愿众神垂怜！"
 daneflavor.3.a: "未来一片灰暗。"
 daneflavor.4.title: "重建[ShowLocationName('leicester')]"
 daneflavor.4.b: "我们负担不起。"
 daneflavor.5.title: "重建[ShowLocationName('nottingham')]"
 daneflavor.5.b: "我们负担不起。"
 daneflavor.6.title: "重建[ShowLocationName('derby')]"
 daneflavor.6.b: "我们负担不起。"
 daneflavor.7.title: "重建[ShowLocationName('rutland')]"
 daneflavor.7.b: "我们负担不起。"
l_simp_chinese:
 consolidated_corruption_of_the_nobles_PV: "腐败精英"
 consolidated_corruption_of_the_nobles_PV_desc: "上层阶级中无可救药的分子$corruption_desc$"
 cathar_reforms: "清洁派改革"
 cathar_reforms_desc: "一项倡导包容、团结与宗教间理解的进步性宗教改革，强调共同价值观、相互尊重及精神和谐。"
 alodial_properties: "自主地产"
 alodial_properties_desc: "自主地产指完全独立拥有的土地，免除一切封建义务或政府税赋，无需缴纳租金或提供服务。"
 occitan_nobility: "奥克贵族"
 occitan_nobility_desc: "如果能在政治阶层中获得更大权力与影响力，奥克贵族将支持征收更多征召兵。"
 PV_ruling_elites: "统治精英"
 PV_ruling_elites_desc: "我们的社会历史上由武士骑士组成的统治精英阶层构成，这个阶层的自由民每年需缴纳赋税；虽然社会结构随时间演变，但与该阶层相关的特权与责任依然存续。"
 PV_groschen: "摩拉维亚格罗申"
 PV_groschen_desc: "数十年来，摩拉维亚贵族一直在铸造区域版银制格罗申。\n尽管我国没有官方货币，摩拉维亚格罗申已逐渐成为境内实际流通的货币单位。"
 PV_new_coiniage: "新铸币权"
 PV_new_coiniage_desc: "授予市民铸币权将使国家能够全面掌控本国的货币铸造。"
 vapnatak: "瓦普纳塔克"
 vapnatak_desc: "“瓦普纳塔克”最初是斯堪的纳维亚的一种仪式，附庸通过举剑向新领主致敬，以示忠诚。\n随着时间的推移，它已发展成一套复杂的特权与义务体系，显著增强了贵族的权力。"
 sokeman: "索克曼"
 sokeman_desc: "索克曼是指独自拥有土地保有权、自主管理并承担相应税负的佃农阶层成员。"